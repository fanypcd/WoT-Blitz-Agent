UI_about_text: "Armor Inspector version: <b>{}</b><br /><br />original idea and implementation by<br />Andrew Karpushin<br /><br />user experience and interface by<br />Clément Durand<br /><br />special thanks to the translators<br />Chinese: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japanese: alphasave1<br />German: Weihan, Liner8<br />Turkish: Metin61<br /><br />Armor Inspector is independent from the creators of World of Tanks and Mir Tankov. Your support is important! thanks!<br /><br />this product does not belong to Wargaming.net and Lesta Games and is developed in accordance with Developer Partner Program terms and policies"
UI_modules_no_information: "we are sorry but {} doesn’t provide any information about internal modules for that tank."
UI_modules_try_heatmaps: "try <b>Heatmaps</b> mode to see where modules receive most critical hits."
UI_help_confrontation: "<b>confrontation mode</b> simulates a shot against a tank's armor<br /><br />• choose two tanks: a shooter and a target.<br />• tap the target to place your shot.<br />• analyze the target with one of the tools.<br />• detail the results using the info tab"
UI_help_collision: "le mode <b>Collision</b> teste la capacité à percuter l'enemi.<br /><br />• choisssez deux chars<br />• réglez les vitesses, à coté du electeur de chars.<br />• tappez la cible pour determiner le lieu de l'impact<br />• detaillez resultats avec l'onglet info"
UI_paid_content_descr_premium: "This view requires to download a texture. SD textures are downloaded by default. Download HD textures to improve visual quality."
UI_paid_content_descr_confrontation: "la caméra est bloquée pour les chars tier 9, 10 et premiums. débloquez le pack Confrontation et aidez-nous à continuer Armor Inspector."
UI_paid_content_descr_collision: "la caméra est bloquée pour les collisions. débloquez-la et aidez nous à continuer Armor Inspector."
UI_paid_content_descr_heatmaps: "the camera is locked for Heatmaps.<br /><br />heatmaps require additional data processing on our server and add extra expenses for data transfer. they are only fully available to WOTInspector subscribers."
UI_paid_content_descr_cutaway: "la caméra est bloquée pour les écorchés. débloquez-la et aidez nous à continuer Armor Inspector."
UI_paid_content_descr_cutaway_xray: "la caméra est bloquée pour les écorchés. \n\nen rayons X, découpez les chars, observez les épaisseurs de blindage et les modules.\nen confrontation, suivez la trajectoire dans le char et à travers chaque blindage, module, équipage. \n\ndébloquez la caméra et aidez nous à continuer Armor Inspector."
UI_visit_purchases: "visiter la boutique"
UI_navigate_xray: "mode rayons X"
UI_try_low_tier: "éssayer avec un rang inférieur"
UI_iap_confrontation_desc: "le mode Confrontation permet de tester la protection de votre blindage et la pénétration de vos tirs en confrontant 2 chars.\n\ncet achat débloque les chars de rang IX-X et premium. il vous permettra également de télécharger les textures HD pour le skin Blitz.\n\nles écorchés sont vendus séparément."
UI_iap_collision_desc: "Collision vous permet de comprendre les caractéristiques d'une collision entre deux chars.\n\nCet achat débloque la caméra et vous permet d'ajuster la vietsse et l'angle de chaque char."
UI_iap_bigbundle_desc: "le Multipack débloque la totalité de l'app, ainsi que le contenu et les outils des futures mises à jour.\n\nArmor Inspector explore de nombreuses mécaniques du jeu. pénétration, modules, collisions... mais bien plus restent mystérieuses comme la visibilité, la précision des tirs, les equipments, etc...\n\navec votre aide nous pourrons les rendre visible et simulables."
UI_iap_cutaway_desc: "nouvel outil écorché. dans le mode X-ray il coupe le char et permet d'explorer le blindage et les modules internes. dans le mode confrontation on peut observer chaque étape de la pénétration de chaque blindage, équipage ou module.\n\n\nthis purchase will unlock the camera and will let you cut the tank and explore the internal trajectory of any shot."
UI_patreon_desc: "En supportant wotinspector avec l'abonnement, vous pouvez déverrouiller l'intégralité du site Web et des applications pour vous, ainsi que pour tous vos compagnons de clan de WoT Blitz et PC. Les niveaux suivants sont disponibles:"
