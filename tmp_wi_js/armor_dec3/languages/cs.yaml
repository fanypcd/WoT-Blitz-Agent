UI_contacts_text: "Děkujeme, že používáte Armor Inspector. Více informací o aplikaci Armor Inspector najdete v následujících zdrojích:"
UI_hd_textures_desc: "Textury v HD kvalitě se stahují z našeho serveru a vyžadují datové připojení, místo v úložišti a mohou vaše zařízení zpomalit, protože potřebují hodně výpočetního výkonu.<br /><br />Stisknutím tlačítka Stáhnout níže stáhnete data pro každý tank zvlášť. Provoz serverů platíme my, proto mají bezplatní uživatelé omezení na jedno stažení denně."
