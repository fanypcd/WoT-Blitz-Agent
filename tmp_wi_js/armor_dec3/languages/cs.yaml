UI_about_text: "Armor Inspector verze: <b>{}</b><br /><br />původní nápad a implementace<br />Andrew Karpushin<br /><br />uživatelské prostředí a rozhraní<br />Clément Durand<br /><br />zvláštní poděkování překladatelům<br />Čínština: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japonština: alphasave1<br />Němčina: Weihan, Liner8<br />Turečtina: Metin61<br /><br />Armor Inspector je nezávislý na tvůrcích her World of Tanks a Mir Tankov. Vaše podpora je důležitá, děkujeme!<br /><br />Tento produkt nepatří společnostem Wargaming.net ani Lesta Games a je vyvíjen v souladu s podmínkami a zásadami programu Developer Partner Program"
UI_modules_no_information: "we are sorry but {} doesn’t provide any information about internal modules for that tank."
UI_modules_try_heatmaps: "try <b>Heatmaps</b> mode to see where modules receive most critical hits."
UI_help_confrontation: "<b>confrontation mode</b> simulates a shot against a tank's armor<br /><br />• choose two tanks: a shooter and a target.<br />• tap the target to place your shot.<br />• analyze the target with one of the tools.<br />• detail the results using the info tab"
UI_help_collision: "<b>kolizní mód</b> simuluje poškození tanku nárazem.<br /><br />• zvolte narážející a cílový tank<br />• nastavte rychlost tanku<br />• dotkněte se cíle pro určení místa a úhlu nárazu<br />• prohlédněte si detaily na informační záložce"
UI_paid_content_descr_premium: "This view requires to download a texture. SD textures are downloaded by default. Download HD textures to improve visual quality."
UI_paid_content_descr_confrontation: "kamera je uzamčena pro tier IX-X a prémiová vozidla. zakoupením Konfrontačního balíčku nám pomůžete s dalším vývojem Armor Inspectoru."
UI_paid_content_descr_collision: "kamera je uzamčena pro poškození nárazem. zakoupením Kolizního balíčku nám pomůžete s dalším vývojem Armor Inspectoru."
UI_paid_content_descr_heatmaps: "the camera is locked for Heatmaps.<br /><br />heatmaps require additional data processing on our server and add extra expenses for data transfer. they are only fully available to WOTInspector subscribers."
UI_paid_content_descr_cutaway: "kamera je uzamčena pro průřezy. zakoupením Průřezového balíčku nám pomůžete s dalším vývojem Armor Inspectoru."
UI_paid_content_descr_cutaway_xray: "kamera je uzamčena pro průřezy.\n\nv módu Rentgenu můžete vytvořit průřez pancíře pro prohlédnutí jeho tloušťky, profilu a modulů.\nv Konfrontačním módu můžete sledovat trajektorii a náraz střely uvnitř tanku, napříč každým plátem pancíře, posádkou a modulem.\n\nzakoupením Průřezového balíčku nám pomůžete s dalším vývojem Armor Inspectoru."
UI_visit_purchases: "navštívit obchod"
UI_navigate_xray: "zkuste v módu Rentgenu"
UI_try_low_tier: "otestujte s tankem nižší úrovně"
UI_iap_confrontation_desc: "Konfrontační mód umožňuje testovat ochrannou funkci pancíře a průnik střely za pomoci dvou tanků.\n\nTento nákup odemyká kameru pro tier IX-X a pro prémiové tanky. umožní vám také stahování Blitz hitskin - nárazových textur - v HD tkvalitě\nPrůřezový nástroj je dostupný v jiném balíčku"
UI_iap_collision_desc: "Kolizní mód ukazuje možnosti způsobení/obdržení poškození nárazem.\n\ntento nákup odemyká kameru a umožňuje nastavení rychlosti, směru a místa nárazu "
UI_iap_bigbundle_desc: "Velký balíček odemyká veškeré nynější a budoucí možnosti a vlastnosti aplikace a to i pro všechny příští aktualizace, navždy.\n\nArmor Inspector již nyní umožňuje prozkoumání mnoha z herních mechanik. průstřel, kolizi, poškození modulů... nicméně mnohé mechaniky zatím zůstávají neznámé, jako jsou viditelnost, rozptyl, vybavení a podobně.\n\ns vaší pomocí je můžeme všechny postupně odhalit."
UI_iap_cutaway_desc: "nový nástroj Průřez. v módu Rentgenu umožňuje vytvořit průřez libovolným místem kteréhokoliv tanku pro porozumnění vlastnotí pancíře a modulů. v Konfrontačním módu umožňuje nástroj Průřez sledování detailů trajektorie střely, vliv plátů pancíře, umístění modulů a posádky.\n\ntento nákup odemyká kameru a umožní vám vytvořit průřez tankem s prozkoumáním interní trajektorie každé střely."
UI_patreon_desc: "Podpořením wotinspector odběrem, můžete odemknout celou webovou stránku a aplikace jak pro vás, tak i pro ostatní kamarády z her WoT Blitz a WoT PC. Jsou dostupné následující úrovně:"
UI_patreon_tier3: "$3/měsíc"
UI_patreon_tier3_desc: "Odemkněte Armor Inspector pro váš WoT účet. Obsahuje také možnost využít mobilní aplikaci na iOS a Androidu."
UI_patreon_tier5: "$5/měsíc"
UI_patreon_tier5_desc: "Odemkněte Armor Inspector a Map Inspector aplikace pro váš WoT účet."
UI_patreon_tier15: "$15/měsíc"
UI_patreon_tier15_desc: "Odemkněte Armor Inspector a Map Inspector pro váš WoT Blitz klan. Všichni členové mohou využívat aplikace na všech platformách."
UI_patreon_tier20: "$20/měsíc"
UI_patreon_tier20_desc: "Odemkněte Armor Inspector a Map Inspector pro vaše WoT Blitz a také WoT PC klany. Všichni členové mohou využívat aplikace na všech platformách."
