UI_about_text: "Armor Inspector version: <b>{}</b><br /><br />original idea and implementation by<br />Andrew Karpushin<br /><br />user experience and interface by<br />Clément Durand<br /><br />special thanks to the translators<br />Chinese: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japanese: alphasave1<br />German: Weihan, Liner8<br />Turkish: Metin61<br /><br />Armor Inspector is independent from the creators of World of Tanks and Mir Tankov. Your support is important! thanks!<br /><br />this product does not belong to Wargaming.net and Lesta Games and is developed in accordance with Developer Partner Program terms and policies"
UI_modules_no_information: "we are sorry but {} doesn’t provide any information about internal modules for that tank."
UI_modules_try_heatmaps: "try <b>Heatmaps</b> mode to see where modules receive most critical hits."
UI_help_confrontation: "<b>confrontation mode</b> simulates a shot against a tank's armor<br /><br />• choose two tanks: a shooter and a target.<br />• tap the target to place your shot.<br />• analyze the target with one of the tools.<br />• detail the results using the info tab"
UI_help_collision: "<b>collision mode</b> simulates the ramming features of a tank.<br /><br />• select any rammer and target tank<br />• set the speed near the tank selector<br />• tap the target to set the location and angle of the ram<br />• detail the results in the info tab"
UI_paid_content_descr_premium: "This view requires to download a texture. SD textures are downloaded by default. Download HD textures to improve visual quality."
UI_paid_content_descr_confrontation: "la cámara está bloqueada para los tanques premium de los niveles IX y X. Por favor, compra el paquete de confrontación y ayúdanos a continuar con Armor Inspector."
UI_paid_content_descr_collision: "La cámara está bloqueada para embestidas. Por favor, compra el paquete de colisiones y ayúdanos a continuar con Armor Inspector."
UI_paid_content_descr_heatmaps: "the camera is locked for Heatmaps.<br /><br />heatmaps require additional data processing on our server and add extra expenses for data transfer. they are only fully available to WOTInspector subscribers."
UI_paid_content_descr_cutaway: "La cámara está bloqueada para el modo cortes transversales. Por favor, compra el paquete de cortes transversales y ayúdanos a continuar con Armor Inspector."
UI_paid_content_descr_cutaway_xray: "La cámara está bloqueada para el modo cortes transversales.\n\nEn el modo rayos-X, puedes cortar el blindaje de cualquier tanque para ver el grosor del blindaje y la ubicación de los módulos.\nEn el modo confrontación, puedes seguir la trayectoria del disparo dentro del tanque, y ver cómo impacta en cada placa de blindaje, tripulante y módulo.\n\nPor favor, compra el paquete de cortes transversales y ayúdanos a continuar con Armor Inspector."
UI_visit_purchases: "abrir tienda"
UI_navigate_xray: "mirar con X-ray"
UI_try_low_tier: "test it with low tier tank"
UI_iap_confrontation_desc: "El modo confrontación te permite experimentar con la protección de blindaje y la penetración de los disparos, mediante la configuración de dos tanques.\n\nEsta compra desbloquea la cámara para los tanques premium de niveles IX y X. También te permitirá descargar texturas HD para los modelos de impacto para Blitz.\n\nEl modo corte transversal se puede comprar por separado."
UI_iap_collision_desc: "El modo colisión muestra la capacidad de embestida y el daño recibido para cualquier tanque.\n\nEsta compra desbloqueará la cámara, permitiéndote configurar la velocidad, dirección y punto de impacto."
UI_iap_bigbundle_desc: "Big Bundle unlocks all current features, as well as all future content and features of all upcoming updates forever.\n\nArmor Inspector explores a lot of the gamemechanics. penetration, collision, module damage... yet many more remain mysterious like visibility, shot dispersion, equipments, etc...\n\nwith your help we can make them all visible."
UI_iap_cutaway_desc: "Nueva herramienta de Corte Transversal. En modo rayos-X permite cortar a través del blindaje de cualquier tanque, para entender las placas del blindaje y los módulos. En modo confrontación, el corte transversal detalla la trayectoria de los disparos dentro del tanque, con todos los impactos al blindaje, la tripulación y los módulos.\nEsta compra desbloqueará la cámara y te permitirá cortar el tanque y explorar la trayectoria interna de cualquier tiro."
UI_patreon_desc: "Al apoyar a wotinspector suscribiéndote, puedes desbloquear todo el sitio web y las aplicaciones, para ti, y para todos tus compañeros de clan de WoT Blitz y PC. \nEstán disponibles los siguientes niveles:"
UI_patreon_tier3: "$3 al mes"
UI_patreon_tier3_desc: "Unlock Armor Inspector for your WoT account. You can also freely use app on your smartphones iOS or Android."
UI_patreon_tier5: "$5 al mes"
UI_patreon_tier5_desc: "Desbloquea tanto la app de Armor Inspector como la de Map Inspector para tu cuenta de WoT."
UI_patreon_tier15: "$15 al mes"
UI_patreon_tier15_desc: "Desbloquea tanto la aplicación de Armor Inspector como la de Map Inspector para tu clan de WoT. Todos los miembros de tu clan en WoT Blitz podrán acceder a las aplicaciones libremente, desde cualquier plataforma."
UI_patreon_tier20: "$20 al mes"
UI_patreon_tier20_desc: "Desbloquea tanto la aplicación de Armor Inspector como la de Map Inspector para tus clanes de WoT Blitz y WoT PC. Todos los miembros de tus clanes de los dos juegos podrán acceder libremente a las aplicaciones desde cualquier plataforma."
