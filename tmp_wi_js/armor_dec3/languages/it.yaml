UI_about_text: "Armor Inspector version: <b>{}</b><br /><br />original idea and implementation by<br />Andrew Karpushin<br /><br />user experience and interface by<br />Clément Durand<br /><br />special thanks to the translators<br />Chinese: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japanese: alphasave1<br />German: Weihan, Liner8<br />Turkish: Metin61<br /><br />Armor Inspector is independent from the creators of World of Tanks and Mir Tankov. Your support is important! thanks!<br /><br />this product does not belong to Wargaming.net and Lesta Games and is developed in accordance with Developer Partner Program terms and policies"
UI_modules_no_information: "we are sorry but {} doesn’t provide any information about internal modules for that tank."
UI_modules_try_heatmaps: "try <b>Heatmaps</b> mode to see where modules receive most critical hits."
UI_help_confrontation: "<b>confrontation mode</b> simulates a shot against a tank's armor<br /><br />• choose two tanks: a shooter and a target.<br />• tap the target to place your shot.<br />• analyze the target with one of the tools.<br />• detail the results using the info tab"
UI_help_collision: "la modalità <b>speronamento</b> simula le caratteristiche di speronamento di un carro armato.<br /><br />• seleziona qualsiasi ariete e bersaglio<br />• impostare la velocità vicino a carro selettore<br />• toccare il bersaglio per impostare la posizione e l'angolo di speronamento<br />• dettagliare i risultati nella scheda informazioni"
UI_paid_content_descr_premium: "This view requires to download a texture. SD textures are downloaded by default. Download HD textures to improve visual quality."
UI_paid_content_descr_confrontation: "la fotocamera è bloccata per i carri di livello IX-X e premium. acquistare il Duello bundle e aiutaci a continuare Armor Inspector."
UI_paid_content_descr_collision: "la fotocamera è bloccata per speronamento. acquista il Pacchetto speronamento e aiutaci a continuare Armor Inspector."
UI_paid_content_descr_heatmaps: "the camera is locked for Heatmaps.<br /><br />heatmaps require additional data processing on our server and add extra expenses for data transfer. they are only fully available to WOTInspector subscribers."
UI_paid_content_descr_cutaway: "la fotocamera è bloccata per Cutaways. acquista il bundle cutaway e aiutaci a continuare Armor Inspector."
UI_paid_content_descr_cutaway_xray: "la fotocamera è bloccata per Cutaways.\n\nin modalità raggi X puoi tagliare qualsiasi armatura del carro armato per vedere lo spessore e i moduli dell'armatura.\nIn modalità confronto, puoi seguire la traiettoria di tiro all'interno del carro armato con ogni corazzatura, equipaggio e modulo colpito.\n\nacquista il pacchetto cutaway e aiutaci a continuare l'ispettore dell'armatura."
UI_visit_purchases: "visita il negozio"
UI_navigate_xray: "controllalo con la modalità raggi X"
UI_try_low_tier: "Provalo con un serbatoio di livello basso"
UI_iap_confrontation_desc: "La modalità confronto ti consente di testare la protezione dell'armatura e la penetrazione dei proiettili impostando due carri armati.\n\nQuesto acquisto sblocca la fotocamera per i carri di livello IX-X e premium. Ti consentirà anche di scaricare le texture HD per il Blitz histkin.\n\nLo strumento Cutaway è disponibile come altro acquisto."
UI_iap_collision_desc: "La modalità Collisione mostra le capacità di speronamento di qualsiasi carro armato, e anche il danno subito e ricevuto.\n\nQuesto acquisto sbloccherà la telecamera, permettendoti di cambiare la velocità e la direzione del carro e il punto d'impatto sul carro nemico "
UI_iap_bigbundle_desc: "Il Pacchetto Completo sblocca tutte le modalità attuali così come tutti i contenuti futuri e le funzionalità degli aggiornamenti imminenti, per sempre.\n\nArmor Inspector esplora molte delle meccaniche del gioco, penetrazione, collisione, danno ai moduli... eppure molte rimangono un mistero, come visibilità, dispersione del colpo, equipaggiamenti, etc...\n\nCon il vostro aiuto, li potremo rendere tutti visibili."
UI_iap_cutaway_desc: "Il nuovo strumento Ritaglio. In modalità Raggi X puoi sezionare qualsiasi parte della corazzatura del carro selezionato per capire meglio lo spessore delle varie parti della corazzatura e il posizionamento dei moduli. Nella modalità Confronto, Ritaglio mostra in dettaglio la traiettoria del proiettile all'interno del carro con tutti i punti di impatto sulla corazzatura, i membri del equipaggio e sui moduli.\n\nQuesto acquisto sbloccherà la telecamera permettendo di sezionare il carro scelto e esplorare la traiettoria interna di qualsiasi colpo."
UI_patreon_desc: "By supporting wotinspector with subscription, you can unlock the entire website and apps for you, and for all your WoT Blitz and PC clanmates. Following tiers are available:"
UI_patreon_tier3: "€ 2.97 al mese"
UI_patreon_tier3_desc: "Sblocca Armor Inspector per il tuo account WoT. Puoi anche utilizzare liberamente l'app sui tuoi smartphone iOS o Android."
UI_patreon_tier5: "€ 4.98 al mese"
UI_patreon_tier5_desc: "Sblocca entrambe le app Armor Inspector e Map Inspector per il tuo account WoT."
UI_patreon_tier15: "€ 14.93 al mese"
UI_patreon_tier15_desc: "Sblocca entrambe le app Armor Inspector e Map Inspector per il tuo clan WoT Blitz. Tutti i membri del tuo clan WoT Blitz possono accedere liberamente alle app su qualsiasi piattaforma."
UI_patreon_tier20: "€ 19.91 al mese"
UI_patreon_tier20_desc: "Sblocca entrambe le app Armor Inspector e Map Inspector per i tuoi clan WoT Blitz E WoT PC. Tutti i membri del tuo clan di tutti e due i giochi possono accedere liberamente alle app su qualsiasi piattaforma."
