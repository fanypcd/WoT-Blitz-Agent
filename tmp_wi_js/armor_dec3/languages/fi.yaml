UI_patreon_tier15: "$15/kk"
UI_patreon_tier15_desc: "Unlock both Armor Inspector and Map Inspector apps for your WoT Blitz clan. All your WoT Blitz clan members can freely access apps on any platform."
UI_patreon_tier20: "$20/kk"
UI_patreon_tier20_desc: "Unlock both Armor Inspector and Map Inspector apps for your WoT Blitz AND WoT PC clans. All your clan members from two games can freely access apps on any platform."
