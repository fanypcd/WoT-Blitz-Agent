UI_about_text: "Armor Inspector version: <b>{}</b><br /><br />original idea and implementation by<br />Andrew Karpushin<br /><br />user experience and interface by<br />Clément Durand<br /><br />special thanks to the translators<br />Chinese: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japanese: alphasave1<br />German: Weihan, Liner8<br />Turkish: Metin61<br /><br />Armor Inspector is independent from the creators of World of Tanks and Mir Tankov. Your support is important! thanks!<br /><br />this product does not belong to Wargaming.net and Lesta Games and is developed in accordance with Developer Partner Program terms and policies"
UI_modules_no_information: "we are sorry but {} doesn’t provide any information about internal modules for that tank."
UI_modules_try_heatmaps: "try <b>Heatmaps</b> mode to see where modules receive most critical hits."
UI_help_confrontation: "<b>confrontation mode</b> simulates a shot against a tank's armor<br /><br />• choose two tanks: a shooter and a target.<br />• tap the target to place your shot.<br />• analyze the target with one of the tools.<br />• detail the results using the info tab"
UI_help_collision: "<b>collision mode</b> simulates the ramming features of a tank.<br /><br />• select any rammer and target tank<br />• set the speed near the tank selector<br />• tap the target to set the location and angle of the ram<br />• detail the results in the info tab"
UI_paid_content_descr_premium: "This view requires to download a texture. SD textures are downloaded by default. Download HD textures to improve visual quality."
UI_paid_content_descr_confrontation: "kamera on lukittu tason IX-X ja priima tankeille. osta Kohtaaminen- paketti sekä auta meitä jatkamaan Armor Inspectoria."
UI_paid_content_descr_collision: "kamera on lukittu törmäämiseen. osta törmäys- paketti ja auta meitä jatkamaan Armor Inspectoria."
UI_paid_content_descr_heatmaps: "the camera is locked for Heatmaps.<br /><br />heatmaps require additional data processing on our server and add extra expenses for data transfer. they are only fully available to WOTInspector subscribers."
UI_paid_content_descr_cutaway: "kamera on lukittu läpileikkausta varten. osta läpileikkaus- paketti ja auta meitä jatkamaan Armor Inspectoria."
UI_paid_content_descr_cutaway_xray: "the camera is locked for Cutaways. \n\nin X-ray mode you can cut through any tank armor to see armor thickness and modules.\nIn confrontation mode, you can follow the shot trajectory inside the tank with each armor plates, crew and module hit.\n\npurchase the cutaway bundle and help us continue armor inspector."
