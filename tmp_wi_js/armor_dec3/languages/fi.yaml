UI_navigate_xray: "open X-ray"
UI_try_low_tier: "test it with low tier tank"
UI_iap_confrontation_desc: "Confrontation mode allows you to test armor protection and shell penetration by setting two tanks.\n\nthis purchase unlocks the camera for tier IX-X and premium tanks. it will also let you download HD textures for the Blitz histkin.\n\nthe Cutaway tool is available as a different purchase."
UI_iap_collision_desc: "Törmäys tila auttaa sinua ymmärtämään törmäyksen vaikutuksia mihin tahansa tankkiin.\n\nTämä osto avaa törmäys tilan kaikille pelin valtioille."
UI_iap_bigbundle_desc: "Tämä paketti avaa kaikki nykyiset ja tulevat ominaisuudet. Kun olet ostanut tämän paketin, saat kaikki sovelluksen tulevat maksulliset ominaisuudet ilmaiseksi"
UI_iap_cutaway_desc: "new Cutaway tool. in X-ray mode it lets you cut through any tank armor to understand the armor plates and the modules. In confrontation mode, cutaway details the shot trajectory inside a tank with all hits to armor plates, crew and modules.\n\nthis purchase will unlock the camera and will let you cut the tank and explore the internal trajectory of any shot."
UI_patreon_desc: "By supporting wotinspector with subscription, you can unlock the entire website and apps for you, and for all your WoT Blitz and PC clanmates. Following tiers are available:"
