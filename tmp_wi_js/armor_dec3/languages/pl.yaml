UI_about_text: "Wersja Armor Inspectora: <b>{}</b><br /><br />Pomysł, projekt i wykonanie:<br />Andrew Karpushin<br /><br />Doświadczenie użytkownika i interfejs:<br />Clément Durand<br /><br />Specjalne podziękowania dla tłumaczy:<br />Chiński: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japoński: alphasave1<br />Niemiecki: Weihan, Liner8<br />Turecki: Metin61<br />Polski: ­­<br /><br />Armor Inspector jest niezależny od twórców World of Tanks i Mir Tankov. Twoje wsparcie jest dla nas bardzo ważne! dziękujemy!<br /><br />Ten produkt nie należy do Wargaming.net ani Lesta Games i jest rozwijany zgodnie z warunkami oraz zasadami programu Developer Partner Program."
UI_modules_no_information: "Przepraszamy, ale {} nie udostępnia informacji o modułach wewnętrznych dla tego czołgu."
UI_modules_try_heatmaps: "Wypróbuj tryb <b>Heatmaps</b>, aby zobaczyć, gdzie moduły najczęściej otrzymują trafienia krytyczne."
UI_help_confrontation: "Tryb <b>Konfrontacji</b> symuluje strzał w pancerz czołgu.<br /><br />• wybierz dwa czołgi: strzelający i cel.<br />• kliknij w cel, aby ustawić punkt trafienia.<br />• przeanalizuj wynik jednym z narzędzi.<br />• szczegóły sprawdź w zakładce Info."
UI_help_collision: "<b>Tryb kolizji</b> symuluje taranowanie pojazdów.<br /><br />• wybierz pojazd taranujący i cel<br />• ustaw prędkość pojazdu<br />• kliknij cel, aby ustawić miejsce i kąt taranowania<br />• szczegóły sprawdź w zakładce Informacje"
UI_paid_content_descr_premium: "Aby użyć tego widoku, trzeba pobrać teksturę. Domyślnie pobierane są tekstury SD. Pobierz tekstury HD, żeby uzyskać lepszą jakość."
UI_paid_content_descr_confrontation: "Kamera jest zablokowana dla pojazdów IX–X poziomu i premium. Kup pakiet Konfrontacji i pomóż nam rozwijać Armor Inspectora."
UI_paid_content_descr_collision: "Kamera jest zablokowana dla trybu taranowania. Kup pakiet Kolizje i pomóż nam rozwijać Armor Inspectora."
UI_paid_content_descr_heatmaps: "Kamera dla trybu Heatmaps jest zablokowana.<br /><br />Heatmaps wymagają dodatkowego przetwarzania danych na naszych serwerach, dlatego pełna funkcjonalność jest dostępna tylko dla subskrybentów WOTInspectora."
UI_paid_content_descr_cutaway: "Kamera dla trybu Cutaways jest zablokowana. Kup pakiet Cutaway, aby odblokować tę funkcję i wesprzeć rozwój Armor Inspectora."
UI_paid_content_descr_cutaway_xray: "Kamera w trybie Cutaways jest zablokowana.\n\nW trybie X-ray możesz przeciąć pancerz dowolnego czołgu, aby zobaczyć jego grubość i moduły.\nW trybie Konfrontacji możesz śledzić tor lotu pocisku wewnątrz czołgu, wraz z trafieniami w pancerz, załogę i moduły.\n\nKup pakiet Cutaway, aby odblokować tę funkcję i wesprzeć rozwój Armor Inspectora."
UI_visit_purchases: "Odwiedź sklep"
UI_navigate_xray: "Sprawdź to w trybie X-ray"
UI_try_low_tier: "Przetestuj to na pojeździe niskiego poziomu"
UI_iap_confrontation_desc: "Tryb Konfrontacji pozwala sprawdzić pancerz i penetrację, wybierając dwa czołgi.\n\nZakup odblokowuje kamerę dla czołgów IX–X i premium oraz pozwala pobierać tekstury HD dla Blitz HistSkin.\n\nNarzędzie Cutaway można kupić osobno."
UI_iap_collision_desc: "Tryb Kolizji pokazuje siłę taranowania oraz otrzymywane uszkodzenia dla dowolnego czołgu.\n\nTen zakup odblokowuje kamerę, pozwalając ustawić prędkość, kierunek i punkt uderzenia."
UI_iap_bigbundle_desc: "Pakiet Big Bundle odblokowuje wszystkie obecne funkcje oraz wszystkie przyszłe treści i funkcje dodawane w kolejnych aktualizacjach, na zawsze.\n\nArmor Inspector analizuje wiele mechanik gry, penetrację, kolizje, uszkodzenia dla modułów… ale wciąż wiele pozostaje tajemnicą, jak wykrywanie, rozrzut działa, wyposażenie i inne.\n\nZ Twoją pomocą możemy odkryć je wszystkie."
UI_iap_cutaway_desc: "Nowe narzędzie Cutaway. W trybie X-ray pozwala przeciąć pancerz dowolnego czołgu, aby zobaczyć grubość pancerza i moduły. W trybie konfrontacji Cutaway pokazuje szczegółowo tor lotu pocisku wewnątrz czołgu, wraz z trafieniami w pancerz, załogę i moduły.\n\nTen zakup odblokowuje kamerę oraz pozwala przecinać czołg i analizować wewnętrzną trajektorię każdego strzału."
UI_patreon_desc: "Wspierając WotInspectora subskrypcją, odblokujesz całą stronę i aplikacje dla siebie oraz dla wszystkich swoich klanowych kolegów z WoT Blitz i WoT PC.\nDostępne są następujące poziomy subskrypcji:"
UI_patreon_tier3: "$3/miesięcznie"
UI_patreon_tier3_desc: "Odblokuj Armor Inspectora dla swojego konta WoT. Możesz też swobodnie korzystać z aplikacji na smartfonach z iOS i Androidem."
UI_patreon_tier5: "$5/miesięcznie"
UI_patreon_tier5_desc: "Odblokuj Armor Inspectora i Map Inspectora dla swojego konta WoT."
UI_patreon_tier15: "$15/miesięcznie"
UI_patreon_tier15_desc: "Odblokuj Armor Inspectora i Map Inspectora dla swojego klanu WoT Blitz. Wszyscy członkowie klanu WoT Blitz będą mogli swobodnie korzystać z aplikacji na dowolnej platformie."
UI_patreon_tier20: "$20/miesięcznie"
UI_patreon_tier20_desc: "Odblokuj Armor Inspectora i Map Inspectora dla swoich klanów WoT Blitz i WoT PC. Wszyscy członkowie klanów z obu gier będą mogli swobodnie korzystać z aplikacji na dowolnej platformie."
