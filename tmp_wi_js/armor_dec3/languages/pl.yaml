UI_contacts_text: "Dziękujemy za korzystanie z Armor Inspectora. Więcej informacji na temat Armor Inspectora znajdziesz tutaj:"
UI_hd_textures_desc: "Tekstury HD są pobierane z naszego serwera i wymagają połączenia z internetem oraz wolnego miejsca na urządzeniu. Ponieważ są bardziej szczegółowe, mogą też lekko spowolnić działanie urządzenia.<br /><br />Po naciśnięciu przycisku tekstury zostaną pobrane osobno dla każdego czołgu. Utrzymanie naszych serwerów jest kosztowne, dlatego użytkownicy wersji darmowej mogą pobrać tekstury raz dziennie."
UI_hd_textures_erase_desc: "Jeśli masz mało miejsca na urządzeniu, możesz usunąć wszystkie wcześniejsze tekstury w panelu ustawień."
