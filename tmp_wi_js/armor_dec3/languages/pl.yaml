UI_iap_essentialpack_desc: "Odblokowuje wszystkie podstawowe funkcje Armor Inspectora, które nie wymagają połączenia z internetem.\n\nObejmuje to Tryb konfrontacji oraz narzędzia Kolizji i Cutaway, także w przyszłych aktualizacjach.\n\nNie obejmuje funkcji online, takich jak modele HD, skiny 3D, kamuflaże i Heatmaps."
UI_wotinspector_subscription: Subskrypcja wotinspektora
UI_iap_wisubscription_desc: "Odblokuj wszystkie funkcje Armor Inspectora, aktywując subskrypcję.\n\nUsuwa wszystkie reklamy. Odblokowuje wszystkie pojazdy, wszystkie tryby oraz ekskluzywny dostęp do danych na naszych serwerach: modele HD, heatmaps, skiny 3D (wkrótce), kamuflaże (wkrótce).\n\nSubskrypcja WOTInspectora odblokowuje także dostęp do aplikacji Map Inspector dla WoT PC i WoT Blitz na wszystkich platformach oraz do całej zawartości na wotinspector.com."
