UI_iap_essentialpack_desc: "Armor İnspector internet erişimi gerektirmeyen tüm temel özelliklerin kilidini açar. \n\nBu, gelecekteki güncellemeler de dahil olmak üzere çarpışma modu, çarpışma ve kesit araçlarını içerir. \n\nHD modelleri, 3D dokular, kamuflajlar ve heatmaps gibi çevrimiçi özelliklere erişimi içermez."
UI_wotinspector_subscription: wotinspector aboneliği
UI_iap_wisubscription_desc: "Armor Inspector'ın tüm özelliklerinin kilidini açmak için aboneliği etkinleştirin.\n\nTüm reklamları kaldırır. Tüm tankların, tüm modların ve sunucularımızda barındırılan verilere özel erişimin kilidini açar: HD modeller, heatmaps, 3D kaplamalar (yakında), kamuflajlar (yakında).\n\nWOTInspector'a abone olarak ayrıca tüm platformlardaki WoT PC ve WoT Blitz için Map Inspector uygulamalarına ve wotinspector.com'daki tüm içeriğe erişimin kilidini açarsınız."
