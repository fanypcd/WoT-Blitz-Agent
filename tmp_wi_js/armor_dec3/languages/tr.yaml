UI_about_text: "Armor Inspector sürümü: <b>{}</b><br /><br />Orijinal fikir ve uygulama:<br />Andrew Karpushin<br /><br />Kullanıcı deneyimi ve arayüzü:<br />Clément Durand<br /><br />Çevirmenlere özel teşekkürler:<br />Çince: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japonca: alphasave1<br />Almanca: Weihan, Liner8<br />Türkçe: Metin61<br /><br />Armor Inspector, World of Tanks ve Mir Tankov'un yaratıcılarından bağımsızdır. Desteğiniz önemlidir! Teşekkürler!<br /><br />Bu ürün Wargaming.net ve Lesta Games'e ait değildir ve Geliştirici Ortaklık Programı şartlarına ve politikalarına uygun olarak geliştirilmiştir"
UI_modules_no_information: "Üzgünüz ancak {} bu tankın dahili modülleri hakkında herhangi bir bilgi vermiyor."
UI_modules_try_heatmaps: "Modüllerin kritik isabetleri nereden aldığını görmek için <b>Heatmaps</b> modunu deneyin."
UI_help_confrontation: "<b>Atış modu</b>, bir tankın zırhına yapılan bir atışı simüle eder<br /><br />• İki tank seçin: bir atıcı ve bir hedef.<br />• Atışınızı yapmak için hedefe dokunun.<br />• Hedefi araçlardan biriyle analiz edin.<br />• Bilgi sekmesini kullanarak sonuçları ayrıntılı olarak inceleyin"
UI_help_collision: "<b>çarpışma modu</b> bir tankın çarpma özelliklerini simüle eder.<br /><br />• herhangi bir ram tankı ve hedef tankı seçin<br />• hızı tank seçicinin yanında ayarlayın<br />• konumu ve açısını ayarlamak için hedefe dokunun<br />• sonuçlara bilgi sekmesinden bakabilirsiniz"
UI_paid_content_descr_premium: "Bu görünüm bir doku indirmeyi gerektirir. SD dokuları varsayılan olarak indirilir. Görsel kaliteyi artırmak için HD dokuları indirin."
UI_paid_content_descr_confrontation: "kamera seviye IX-X ve premium tanklar için kilitlenmiştir. Atış modu paketini satın alın ve Armor Inspector'a devam etmemize yardımcı olun."
UI_paid_content_descr_collision: "kamera çarpma için kilitlendi. çarpışma paketini satın alın ve Armor Inspector'a devam etmemize yardımcı olun."
UI_paid_content_descr_heatmaps: "Kamera Heatmaps için kilitlidir.<br /><br />Heatmapsler sunucumuzda ek veri işleme gerektirir ve veri aktarımı için ekstra masraflar ekler. Bunlar yalnızca WOTInspector aboneleri için tam olarak kullanılabilir."
UI_paid_content_descr_cutaway: "kamera Kesit modu için kilitlendi. Kesit modu paketini satın alın ve Armor Inspector'a devam etmemize yardımcı olun."
UI_paid_content_descr_cutaway_xray: "Kamera Kesit modu için kilitlendi. \n\nX-ışını modunda zırh kalınlığını ve modüllerini görmek için herhangi bir tank zırhını kesebilirsiniz. Atış modunda, vurulan her zırh plakası, mürettebat ve modül ile tankın içindeki atış yörüngesini takip edebilirsiniz.\n\nkesit modunu satın alın ve armor inspector'a devam etmemize yardımcı olun."
UI_visit_purchases: "mağazaya git"
UI_navigate_xray: "x-ray moduyla kontrol edin"
UI_try_low_tier: "düşük seviye tankla deneyin"
UI_iap_confrontation_desc: "Atış modu, iki tank yerleştirilerek zırh korumasını ve mermi delişini test etmenize olanak tanır.\n\nBu satın alma, seviye IX-X ve premium tanklar için kameranın kilidini açar. Aynı zamanda Blitz için HD dokuları indirmenize de izin verecektir.\n\nKesit aracı farklı bir satın alma seçeneğiyle mevcuttur."
UI_iap_collision_desc: "Çarpışma modu herhangi bir tankın çarpma kapasitesini ve alınan hasarı gösterir.\n\nbu satın alma işlemi kameranın kilidini açarak hızı, yönü ve etki noktasını ayarlamanıza olanak tanır "
UI_iap_bigbundle_desc: "Dev Paket, tüm mevcut özelliklerin yanı sıra gelecekteki tüm içeriklerin ve gelecek güncellemelerin tüm özelliklerinin kilidini sonsuza kadar açar.\n\nArmor Inspector birçok oyun mekaniğini araştırıyor. delme, çarpışma, parça hasarı... ancak görünürlük, atış dağılımı, ekipmanlar vb. gibi daha pek çok şey hâlâ gizemini koruyor...\n\nsizin yardımınızla ortaya çıkartabiliriz."
UI_iap_cutaway_desc: "yeni Kesit aracı. X-ray modunda, zırh plakalarını ve modüllerini anlamak için herhangi bir tank zırhını kesmenize olanak tanır. Atış modunda kesit, zırh plakalarına, mürettebata ve modüllere yapılan tüm vuruşlarla birlikte bir tankın içindeki atış yörüngesini gösterir."
UI_patreon_desc: "Wotinspector'u abonelikle destekleyerek kendiniz ve tüm WoT Blitz ve PC klan arkadaşlarınız için tüm web sitesinin ve uygulamaların kilidini açabilirsiniz. Aşağıdaki katmanlar mevcuttur:"
UI_patreon_tier3: "$3/aylık"
UI_patreon_tier3_desc: "WoT hesabınız için Armor Inspector'un kilidini açın. Uygulamayı iOS veya Android akıllı telefonlarınızda da özgürce kullanabilirsiniz."
UI_patreon_tier5: "$5/aylık"
UI_patreon_tier5_desc: "WoT hesabınız için hem Armor Inspector hem de Map Inspector uygulamalarının kilidini açın."
UI_patreon_tier15: "$15/aylık"
UI_patreon_tier15_desc: "WoT Blitz klanınız için hem Armor Inspector hem de Map Inspector uygulamalarının kilidini açın. Tüm WoT Blitz klan üyeleriniz herhangi bir platformdaki uygulamalara özgürce erişebilir."
UI_patreon_tier20: "$20/aylık"
UI_patreon_tier20_desc: "WoT Blitz ve WoT PC klanlarınız için hem Armor Inspector hem de Map Inspector uygulamalarının kilidini açın. İki oyundaki tüm klan üyeleriniz herhangi bir platformdaki uygulamalara özgürce erişebilir."
