UI_paid_content_descr_premium: "This view requires to download a texture. SD textures are downloaded by default. Download HD textures to improve visual quality."
UI_paid_content_descr_confrontation: "в цьому режимі обертання камери заблоковано для техніки IX-X рівнів і преміум танків. придбайте набір Дуель для розблокування камери і допомоги нам у розробці додатку."
UI_paid_content_descr_collision: "в цьому режимі обертання камери заблоковано. придбайте набір Таран для розблокування камери і допомоги нам у розробці додатку."
UI_paid_content_descr_heatmaps: "the camera is locked for Heatmaps.<br /><br />heatmaps require additional data processing on our server and add extra expenses for data transfer. they are only fully available to WOTInspector subscribers."
UI_paid_content_descr_cutaway: "в цьому режимі обертання камери заблоковано. придбайте набір Розріз для розблокування камери і допомоги нам у розробці додатку."
UI_paid_content_descr_cutaway_xray: "обертання камери заблоковано для режиму Розріз.\n\nу режимі Рентген, Розріз дозволяє побачити товщину броні та модулі.\nу режимі Дуель, Розріз показує повну траекторію польоту снаряда і пошкоджені модулі.\n\nпридбайте набір Розріз для розблокування камери і допомоги нам у розробці додатку."
