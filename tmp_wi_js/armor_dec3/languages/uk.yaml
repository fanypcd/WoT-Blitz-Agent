UI_iap_confrontation_desc: "Дуель дозволяє тестувати бронювання танків проти різних гармат.\n\nпокупка відкриває обертання камери і башти для преміумних танків і техніки IX-X рівнів.\n\nРозріз відкривається окремою покупкою."
UI_iap_collision_desc: "Таран показує приблизні пошкодження при тарані одного танка іншим.\n\nпокупка відкриває обертання камери, вибір швидкості, напрямок руху і точку зіткнення."
UI_iap_bigbundle_desc: "Велике Поповнення відкриває всі доступні функції, а також дає доступ до всіх майбутніх нововведень.\n\nз вашою допомогою введення нових функцій прискориться."
UI_iap_cutaway_desc: "режим Розріз:\n  • у режимі Рентген дозволяє побачити товщину броні та модулі.\n  • у режимі Дуель показує повну траекторію польоту снаряда, пошкоджені модулі та члени екіпажу.\n\nця покупка розблокує обертання камери, дає змогу розрізати танк і роздивитись траекторію польоту кожного пострілу."
UI_patreon_desc: "By supporting wotinspector with subscription, you can unlock the entire website and apps for you, and for all your WoT Blitz and PC clanmates. Following tiers are available:"
