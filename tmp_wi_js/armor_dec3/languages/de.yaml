UI_about_text: "Armor Inspector version: <b>{}</b><br /><br />original idea and implementation by<br />Andrew Karpushin<br /><br />user experience and interface by<br />Clément Durand<br /><br />special thanks to the translators<br />Chinese: 三ツ橋 小宵, Alien_robot, Oliver_s, David Copperfield<br />Japanese: alphasave1<br />German: Weihan, Liner8<br />Turkish: Metin61<br /><br />Armor Inspector is independent from the creators of World of Tanks and Mir Tankov. Your support is important! thanks!<br /><br />this product does not belong to Wargaming.net and Lesta Games and is developed in accordance with Developer Partner Program terms and policies"
UI_modules_no_information: "we are sorry but {} doesn’t provide any information about internal modules for that tank."
UI_modules_try_heatmaps: "try <b>Heatmaps</b> mode to see where modules receive most critical hits."
UI_help_confrontation: "<b>confrontation mode</b> simulates a shot against a tank's armor<br /><br />• choose two tanks: a shooter and a target.<br />• tap the target to place your shot.<br />• analyze the target with one of the tools.<br />• detail the results using the info tab"
UI_help_collision: "<b>Kollisionsmodus simuliert</b> die Rammfunktionen eines Tanks.<br /><br />• Wählen Sie einen beliebigen Panzer zum rammen und einen Zielpanzer<br />• Stellen Sie die Geschwindigkeit in der Nähe des Panzer-Selektors<br />• Tippen Sie auf das Ziel, um den Ort und den Winkel des Rammes einzustellen<br />• Detail-Ergebnisse im Info-Tab"
UI_paid_content_descr_premium: "This view requires to download a texture. SD textures are downloaded by default. Download HD textures to improve visual quality."
UI_paid_content_descr_confrontation: "Die Kamera ist für Stufe IX-X und Premium-Panzer verschlossen. Kauf das Confrontation Bundle und hilf uns, Armor Inspector fortzusetzen."
UI_paid_content_descr_collision: "Die Kamera ist für Rammen verschlossen. Kauf das Confrontation Bundle und hilf uns, Armor Inspector fortzusetzen."
UI_paid_content_descr_heatmaps: "the camera is locked for Heatmaps.<br /><br />heatmaps require additional data processing on our server and add extra expenses for data transfer. they are only fully available to WOTInspector subscribers."
UI_paid_content_descr_cutaway: "Die Kamera ist für Ausschnitte verschlossen. Kauf das Confrontation Bundle und hilf uns, Armor Inspector fortzusetzen."
UI_paid_content_descr_cutaway_xray: "die Kamera ist für Ausschnitte gesperrt. \n\nim Röntgenmodus kannst du jede Panzerrüstung durchschneiden, um Rüstungsdicke und Module zu sehen.\nIm Konfrontationsmodus können Sie die Schussbahn innerhalb des Panzers mit jeder Panzerplatte, der Besatzung und dem Treffer des Moduls verfolgen.\n\nkaufe das Ausschnitte Bundle und hilf uns die Rüstungskontrolle fortzusetzen."
UI_visit_purchases: "Shop öffnen"
UI_navigate_xray: "mit Röntgenmodus prüfen"
UI_try_low_tier: "teste es mit einem niedrigstufigen-Panzer"
UI_iap_confrontation_desc: "Im Konfrontationsmodus können Sie den Panzerschutz und die Durchschlagskraft von Granaten testen, indem Sie zwei Panzer einstellen.\n\nMit diesem Kauf wird die Kamera für Stufe IX-X und Premium-Panzer freigeschaltet. Außerdem können Sie damit HD-Texturen für den Blitz-Hitskin herunterladen.\n\nDas Cutaway-Tool ist in einem anderen Kauf erhältlich."
UI_iap_collision_desc: "Der Kollisionsmodus ermöglicht es dir die Rammeigenschaften der Panzer zu verstehen. Es wird der Kollisionsmodus für alle Nationen freigeschaltet."
UI_iap_bigbundle_desc: "Big Bundle schaltet alle aktuellen Funktionen sowie alle zukünftigen Inhalte und Features aller kommenden Updates für immer frei.\n\nArmor Inspector zeigt viele Spielmechaniken. Durchschlag, Kollision, Modulschaden... noch viele weitere bleiben geheimnisvoll wie Sichtbarkeit, Schussstreuung, Ausrüstung, etc...\n\nmit Deiner Hilfe können wir sie alle sichtbar machen."
UI_iap_cutaway_desc: "Das neue Cutaway-Tool im Röntgenmodus ermöglicht es Ihnen, jede Panzerrüstung zu durchschneiden, um die Rüstungsschilder und die Module zu verstehen. Im Konfrontationsmodus zeigt der Schussweg in einem Panzer mit allen Treffer auf Panzerplatten, Besatzung und Module.\n\nmit diesem Kauf wird die Kamera freigeschaltet und du kannst den Panzer zerschneiden und den internen Verlauf der Schussbahn erkunden."
UI_patreon_desc: "Indem du wotinspector mit einem Abonnement unterstützt, kannst du die gesamte Website und Apps für dich und für alle deine WoT Blitz und PC Clanmitglieder freischalten. Folgende Stufen sind verfügbar:"
UI_patreon_tier3: " 3$ / Monat"
UI_patreon_tier3_desc: "Schalte Armor Inspector für dein WoT-Konto frei. Du kannst auch die App auf deinem iOS oder Android Smartphone kostenlos nutzen."
UI_patreon_tier5: "5$ / Monat"
UI_patreon_tier5_desc: "Schalte sowohl Armor Inspector als auch Map Inspector für dein WoT-Konto frei."
UI_patreon_tier15: "15$ / Monat"
UI_patreon_tier15_desc: "Schalte sowohl Armor Inspector als auch Map Inspector für dein WoT Blitz-Clan frei. Alle deine Clanmitglieder haben freien Zugriff auf Apps auf jeder Plattform."
UI_patreon_tier20: "20$ / Monat"
UI_patreon_tier20_desc: "Schalte sowohl Waffeninspektor als auch Karten-Inspector für deine WoT Blitz UND WoT PC-Clans frei. Alle deine Clanmitglieder aus beiden Spielen haben freien Zugriff auf Apps auf jeder Plattform."
