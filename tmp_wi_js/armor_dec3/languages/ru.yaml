UI_about_text: "Версия Armor Inspector: <b>{}</b><br /><br />Оригинальная идея и реализация<br />Andrew Karpushin<br /><br />Пользовательский интерфейс и дизайн<br />Clément Durand<br /><br />Отдельное спасибо за переводы<br />Китайский: 三ツ橋 小宵, Alien_robot, Oliver_s, Давид Жуков (David Copperfield)<br />Japanese: alphasave1 <br />German: Weihan, Liner8<br />Turkish: Metin61<br /><br />Armor Inspector - приложение, не имеющее отношение к разработчикам World of Tanks и Мир Танков. Твоя поддержка очень важна! Спасибо!<br /><br />Данное приложение не является продуктом Wargaming.net и Lesta Games и разработано согласно правилам Developer Partner Program."
UI_modules_no_information: "к сожалению {} не предоставили информацию о внутренних модулях для этого танка."
UI_modules_try_heatmaps: "попробуйте режим <b>Тепловые карты</b> для того, чтобы узнать, где модули получают наибольшее количество критов."
UI_help_confrontation: "режим <b>Дуэль</b> эмулирует выстрел одного танка по другому.<br /><br />• выберите два танка: стреляющий и цель<br />• нажмите на цель, чтобы сделать выстрел<br />• проанализируйте выстрел с помощью доступных инструментов слева<br />"
UI_help_collision: "режим <b>Таран</b> эмулирует механику тарана.<br /><br />• выберите танк тарана и цель<br />• установите скорости внизу экрана<br />• нажмите на цель, чтобы узнать примерный урон<br />• вся детальная информация отображается в меню (i) инфо"
UI_paid_content_descr_premium: "Необходимо загрузить текстуры. SD текстуры подгружаются автоматически. Загрузите HD текстуры, чтобы улучшить качество отображения."
UI_paid_content_descr_confrontation: "вращение камеры заблокировано в этом режиме для техники уровней IX-X и премиум танков. посетите магазин, чтобы разблокировать вращение камеры и башни и помочь нам в разработке приложения."
UI_paid_content_descr_collision: "вращение камеры заблокировано в этом режиме. посетите магазин, чтобы разблокировать вращение камеры и помочь нам в разработке приложения."
UI_paid_content_descr_heatmaps: "камера заблокирована для тепловых карт.<br /><br />Тепловые карты требуют дополнительной обработки данных на нашем сервере и добавляют дополнительные расходы на передачу данных. они полностью доступны только подписчикам WOTInspector."
UI_paid_content_descr_cutaway: "вращение камеры заблокировано для Сечений. посетите магазин, чтобы разблокировать вращение камеры и помочь нам в разработке приложения."
UI_paid_content_descr_cutaway_xray: "вращение камеры заблокировано для Сечений.\n\nдля Рентгена этот вид позволяет выбрать произвольную плоскость. для Дуэли этот вид показывает полную траекторию полета снаряда и поврежденные модули.\n\nпосетите магазин, чтобы разблокировать вращение камеры и помочь нам в разработке приложения."
UI_visit_purchases: "перейти в магазин"
UI_navigate_xray: "открыть Рентген"
UI_try_low_tier: "загрузить танк низкого уровня"
UI_iap_confrontation_desc: "Дуэль позволяет протестировать бронирование танка против различных орудий.\n\nпокупка открывает вращение камеры и башни для премиумной техники и техники IX-X уровней.\n\nСечение открывается другой покупкой."
UI_iap_collision_desc: "Таран показывает примерный урон при таране одного танка другим.\n\nпокупка открывает использование техники любой нации в режиме Таран. вы сможете свободно вращать камеру и оценивать урон от тарана в разных точках."
UI_iap_bigbundle_desc: "Большое Пополнение открывает все текущие функции вместе со всеми функциями последующих обновлений. вы будете получать платные возможности в следующих обновлениях бесплатно."
UI_iap_cutaway_desc: "новый вид Сечение. в режиме Рентген вы можете выбрать произвольную плоскость для рассечение танка и рассмотреть его со всех сторон. в режиме Дуэль показывается полная траектория полета выстрела со всеми деталями и поврежденными модулями.\n\nэта покупка открывает свободное вращение камеры."
UI_patreon_desc: "Поддержка wotinspector с помощью подписки имеет несколько преимуществ. Вы можете разблокировать приложение не только для себя, но и для вашего WoT Blitz и PC кланов. Доступны следующие варианты:"
UI_patreon_tier3: "$3/месяц"
UI_patreon_tier3_desc: "Разблокирует приложение для вашего WoT аккаунта. Вы также сможете свободно использовать приложение на iOS или Android."
UI_patreon_tier5: "$5/месяц"
UI_patreon_tier5_desc: "Разблокирует Armor Inspector и Map Inspector для вашего WoT аккаунта."
UI_patreon_tier15: "$15/месяц"
UI_patreon_tier15_desc: "Разблокирует Armor Inspector и Map Inspector для всего вашего WoT Blitz клана. Соклановцы смогут свободно использовать оба приложения на любой платформе."
UI_patreon_tier20: "$20/месяц"
UI_patreon_tier20_desc: "Разблокирует Armor Inspector и Map Inspector для ваших WoT Blitz И WoT PC кланов. Соклановцы из двух игр смогут свободно использовать оба приложения на любой платформе."
