UI_essentialpack_purchase: самое необходимое
UI_iap_essentialpack_desc: "Открывает все важные функции Armor Inspector, не требующие доступа в интернет.\n\nЭто включает в себя режим Дуэль, Таран и Сечение, включая будущие обновления.\n\nНе включает доступ к онлайн функциям, таким как HD модели, 3D скины, камуфляжи и тепловые карты."
UI_wotinspector_subscription: подписка wotinspector
UI_iap_wisubscription_desc: "Разблокируйте все функции приложения, активировав подписку.\n\nОтключает рекламу. Открывает все танки, все режимы и эксклюзивный доступ к данным, размещенным на наших серверах: HD модели, тепловые карты, 3D скины (скоро), камуфляжи (скоро).\n\nПодписавшись на WOTInspector, вы также разблокируете доступ к приложениям Map Inspector для wot pc и wot blitz на всех платформах и ко всему контенту на wotinspector.com."
