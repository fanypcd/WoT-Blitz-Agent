STORE_iap_essential_pack_desc: Открывает все важные функции Armor Inspector, не требующие доступа в интернет. Это включает в себя режим Дуэль, Таран и Сечение, включая будущие обновления. Не включает в себя доступ к онлайн функциям, таким как HD модели, 3D скины, камуфляжи и тепловые карты.
