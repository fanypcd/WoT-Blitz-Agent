UI_essentialpack_purchase: 基本包
UI_iap_essentialpack_desc: "解锁装甲检查员的所有基本功能，不需要互联网接入。\n\n这包括对抗模式，碰撞和切换工具，包括未来的更新。\n\n不包括访问在线功能，如高清模型、3D皮肤、伪装和热图。"
UI_wotinspector_subscription: wotinspector订阅服务
UI_iap_wisubscription_desc: "订阅即可解锁《装甲检查员》全部功能。\n\n无广告干扰，解锁所有坦克、玩法模式，以及高清模型、弱点热力图等服务器专属数据（3D涂装、迷彩即将上线）。\n\n订阅后同步解锁全平台《坦克世界》PC/闪击战的地图检查员工具，及wotinspector.com全站内容。"
