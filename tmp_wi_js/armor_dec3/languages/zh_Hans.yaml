UI_help_confrontation: "<b>对战模式</b>模拟对坦克装甲的射击<br /><br />选择两辆坦克:一个射手和一个目标。<br />点击目标进行射击。<br />使用其中一种工具分析目标。<br />使用“信息”选项卡详细说明结果"
UI_help_collision: "<b>撞击模式</b>模拟坦克撞击特性。<br /><br />• 选择任意撞击坦克与目标坦克<br />• 在坦克列表栏附近设置速度<br />• 点击目标设定撞击位置与角度<br />• 在信息栏查看详细撞击结果"
UI_paid_content_descr_premium: "此视图需要下载纹理。默认情况下会下载SD纹理。下载HD纹理，提高视觉质量。"
UI_paid_content_descr_confrontation: "9、10级及金币坦克的视角已锁定。请购买对战功能包并帮助我们维持Armor Inspector。"
UI_paid_content_descr_collision: "碰撞视角目前被锁定，请购买撞击功能包并帮助我们维持Armor Inspector。"
UI_paid_content_descr_heatmaps: "摄像机锁定了热力图。<br /><br />热力图功能需要在我们的服务器上进行额外的数据处理，并增加了数据传输的额外费用。它们只对WOTInspector的订户完全开放。"
UI_paid_content_descr_cutaway: "截面视角目前被锁定。请购买截面功能包并帮助我们维持Armor Inspector。"
UI_paid_content_descr_cutaway_xray: "截面视角目前被锁定。\n\n在透视模式下用户能切割任何坦克装甲以观察装甲的厚度和内部模块。\n在对战模式下能查看坦克内部任何的装甲、成员及坦克模块在弹道上造成的伤害。\n\n请购买截面工具包并帮助我们维持Armor Inspector。"
UI_visit_purchases: "前往商店"
UI_navigate_xray: "透视模式"
UI_try_low_tier: "使用低级坦克测试"
UI_iap_confrontation_desc: "等效模式下能让用户设置两辆坦克来测试坦克护甲和穿甲能力.\n购买以解锁9～10级和金币坦克的视角，同时解锁用于闪击战视图的高清纹理下载。\n\n截面功能需另行购买。"
UI_iap_collision_desc: "碰撞模式可显示任何坦克的撞击能力和受到的伤害。\n\n此购买项将解锁视角限制，允许您设置坦克的速度、方向和撞击点 "
UI_iap_bigbundle_desc: "这个组合包包含了所有现有的功能，也将包括所有会在未来更新中加入的新内容和功能。\n\nArmor Inspector探索了许多游戏机制，穿透、碰撞、模块伤害……但还有更多尚待揭示，如可见性、炮弹散布、装备等等。\n\n有了你的帮助，我们就能实现所有功能。"
UI_iap_cutaway_desc: "新的截面工具在透视模式下可以让用户自由切割坦克从而理解坦克装甲和各个模块。在对抗模式下，截面能详细分析弹道上所有的坦克装甲、车组乘员和模块。\n\n购买这个功能将会解锁视角，然后你就能自由切割坦克并查看坦克内部的任何弹道。"
UI_patreon_desc: "通过订阅支持wot inspector，你能为自己以及在《坦克世界》和《坦克世界闪电战》的军团好友解锁整个网站和全部应用。以下几个等级可用："
UI_patreon_tier3: "$3/月"
UI_patreon_tier3_desc: "为您的坦克世界账户解锁Armor Inspector。您能够在您的iOS或安卓手机上自由使用应用。"
UI_patreon_tier5: "$5/月"
UI_patreon_tier5_desc: "为您的坦克世界账户解锁Armor Inspector和Map Inspector应用。"
UI_patreon_tier15: "$15/月"
UI_patreon_tier15_desc: "为您的闪击战军团解锁Armor Inspector和Map Inspector应用。您闪击战军团中的所有成员能在任何平台上免费访问所有应用。"
UI_patreon_tier20: "$20/月"
UI_patreon_tier20_desc: "为您闪击战和坦克世界的军团成员解锁Armor Inspector和Map Inspector应用。您两个游戏军团中的所有成员能在任何平台上免费访问所有应用。"
