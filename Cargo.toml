[workspace]
members = ["crates/replay-core", "crates/replay-wasm"]

[workspace.metadata.release]
version = "0.4.3"

# 跨 crate 共用的依赖集中声明版本与 feature（此前 root 与两个 crate 三处重复，
# 规模增长后必然漂移）。crate 内用 `foo.workspace = true` 引用。
[workspace.dependencies]
wotb-replay-core = { path = "crates/replay-core" }
wotbreplay-parser = { version = "0.4", features = ["meta", "raw-payload"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 全仓库无 chrono 类型参与 serde 序列化（均为 String/时间戳）——serde feature 闲置，已去
chrono = "0.4"

[package]
name = "wotb-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
wotb-replay-core.workspace = true
wotbreplay-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
anyhow.workspace = true
flate2 = "1"
# DVPL footer 的存储载荷 CRC32 校验。crc32fast 本就在 crate 图里（flate2 经
# miniz_oxide 传递引入），提为直接依赖不新增编译单元。
crc32fast = "1"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
ctrlc = "3"
axum = "0.8"
webbrowser = "1"
rust-embed = { version = "8", features = ["include-exclude"] }

[features]
# 自包含分发：把 data/、web/vendor/、replay_samples/、config.toml.example 编译进 exe，
# 首次运行自释放（见 src/bundle.rs）。构建：cargo build --release --features bundle
# debug-embed 挂在 bundle 下：默认 debug 构建里 rust-embed 运行时读盘
# （frontend/dist 可 npm run build 后直接生效，免重编译），release 构建编译期嵌入。
bundle = ["rust-embed/debug-embed"]
