[package]
name = "wotb-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
wotbreplay-parser = { version = "0.4", features = ["meta", "raw-payload"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
flate2 = "1"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
ctrlc = "3"
axum = "0.8"
webbrowser = "1"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"], optional = true }

[features]
# 自包含分发：把 data/、web/vendor/、replay_samples/、config.toml.example 编译进 exe，
# 首次运行自释放（见 src/bundle.rs）。构建：cargo build --release --features bundle
bundle = ["dep:rust-embed"]
