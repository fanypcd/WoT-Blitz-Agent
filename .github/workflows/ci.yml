name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 核心库 wasm32 编译（契约第 6 节双目标承诺）
        run: cargo check -p wotb-replay-core -p wotb-replay-wasm --target wasm32-unknown-unknown
      - name: 工作区测试（含真实样本探针的单元部分；探针样本不入 CI）
        run: cargo test --workspace
      - name: Clippy 门禁（零告警）
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint（场景 JS 门禁——no-undef 拦截"使用未导入标识符"类运行时错误）
        run: npm run lint
      - name: Vue 构建验证（双通道接入点编译）
        run: npm run build

  # bundle 特性（rust-embed 编译期嵌入 + build.rs 前置检查）此前只在 tag 发布时
  # 首次编译——嵌入面/占位页/目录排除等问题只能等发布时刻爆。debug + bundle 即
  # 走 debug-embed 的编译期嵌入路径，无需完整 release 优化。
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: 前端产物（rust-embed 嵌入输入）
        run: npm run build
        working-directory: frontend
      - name: bundle 特性编译验证（data/ + 前端 + wasm 嵌入路径）
        run: cargo build --features bundle

  # Python 侧回归锁（tools/test_*.py，standalone 脚本：断言失败即非零退出）此前只在
  # 本机按需手跑。依赖本机数据 / 客户端 / WotbTools 检出 / release/ 产物的用例自带
  # 显式 skip（各文件头注明），干净检出上自动跳过，不会假失败。
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 依赖（Pillow：2D 几何回读 / 图标裁剪类测试）
        run: python -m pip install --quiet pillow
      - name: 全量 tools/test_*.py
        run: |
          # 两个 pre-existing 红暂列排除（口径判定后移除并恢复，见 docs/index.md 2026-11-19 条目）：
          # - test_export_surface_flags：water_props 默认值单元素保持列表 vs 测试期望标量，待定哪边对齐客户端属性
          # - test_research_techtree：期望 t11 预览车并入 data/research vs 现役包 11.21 基线不含预览增量
          excluded="tools/test_export_surface_flags.py tools/test_research_techtree.py"
          fail=0
          for f in tools/test_*.py; do
            skip=""
            for e in $excluded; do [ "$f" = "$e" ] && skip=1; done
            if [ -n "$skip" ]; then echo "=== $f（跳过：已知红，待口径判定）"; continue; fi
            echo "=== $f"
            python "$f" || fail=1
          done
          exit $fail
