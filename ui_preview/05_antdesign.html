<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 5 · Ant Design 5 — WoTB.Agent UI 对比</title>
<!-- React UMD + dayjs（antd 5 依赖） + antd UMD + Babel（浏览器内编译，仅作演示；真实项目用 Vite） -->
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/plugin/customParseFormat.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/plugin/weekday.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/plugin/localeData.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/plugin/weekOfYear.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/plugin/weekYear.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/plugin/advancedFormat.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/plugin/quarterOfYear.js"></script>
<script src="https://unpkg.com/antd@5.21.6/dist/antd.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* 兜底基础样式：CDN 不可用时仍可读 */
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body[data-anttheme="dark"]  { background: #141414; color: rgba(255,255,255,.88); }
  body[data-anttheme="light"] { background: #f5f5f5; color: rgba(0,0,0,.88); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  section { margin-top: 20px; }
  .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .grid-tanks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .grid-chat  { display: grid; grid-template-columns: 250px 1fr; gap: 16px; }
  @media (max-width: 860px) {
    .grid-stats { grid-template-columns: repeat(2, 1fr); }
    .grid-chat { grid-template-columns: 1fr; }
  }
  /* 收藏车 / 金币车描边（覆盖 antd Card 边框） */
  .tank-card.premium   { border-color: rgba(255, 193, 7, .75) !important; box-shadow: 0 0 0 1px rgba(255, 193, 7, .35); }
  .tank-card.collector { border-color: rgba(64, 169, 255, .8) !important;  box-shadow: 0 0 0 1px rgba(64, 169, 255, .35); }
  .tank-thumb { position: relative; padding: 18px 12px 10px; }
  .tank-thumb svg { width: 100%; height: 64px; opacity: .55; display: block; }
  .tier-chip { position: absolute; top: 8px; left: 8px; }

  /* 会话列表与聊天气泡（antd 不含聊天组件，自绘并跟随主题） */
  .session-row { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .session-row:hover { background: rgba(255, 138, 61, .08); }
  body[data-anttheme="dark"] .session-row.active { background: rgba(255,138,61,.16); color: #ff8a3d; }
  body[data-anttheme="light"] .session-row.active { background: #fff7ef; color: #d46b08; }
  .chat-log { height: 300px; overflow-y: auto; padding-right: 6px; }
  .bubble-bot  { max-width: 84%; border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.65; margin-bottom: 10px; }
  body[data-anttheme="dark"]  .bubble-bot { background: #1f1f1f; border: 1px solid #303030; }
  body[data-anttheme="light"] .bubble-bot { background: #ffffff; border: 1px solid #f0f0f0; }
  .bubble-user { max-width: 84%; background: rgba(255,138,61,.18); border: 1px solid rgba(255,138,61,.45);
                 border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.65; margin-bottom: 10px; margin-left: auto; width: fit-content; }
  .tool-chip { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; border: 1px dashed rgba(128,128,128,.45);
               opacity: .7; margin-bottom: 4px; }
</style>
</head>
<body data-anttheme="dark">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const { ConfigProvider, Card, Statistic, Tag, Button, Input, Select, Switch, Slider, Segmented, theme } = antd;
const cx = (...a) => a.filter(Boolean).join(' ');

/* ═══ 示例数据 ═══ */
const TANKS = [
  { name: 'IS-7',                 nation: '苏联',   type: '重型坦克', tier: 'X',    win: 52.8, dmg: 2204 },
  { name: 'Object 260',           nation: '苏联',   type: '重型坦克', tier: 'X',    win: 53.4, dmg: 2310, collector: true },
  { name: '121B',                 nation: '中国',   type: '中型坦克', tier: 'X',    win: 54.6, dmg: 2458, premium: true },
  { name: 'E 100',                nation: '德国',   type: '重型坦克', tier: 'X',    win: 51.2, dmg: 2265 },
  { name: 'Leopard 1',            nation: '德国',   type: '中型坦克', tier: 'X',    win: 52.1, dmg: 2372 },
  { name: 'T110E5',               nation: '美国',   type: '重型坦克', tier: 'X',    win: 50.9, dmg: 2190 },
  { name: 'Progetto M35 mod. 46', nation: '意大利', type: '中型坦克', tier: 'VIII', win: 55.3, dmg: 1690, premium: true },
  { name: 'Skorpion G',           nation: '德国',   type: '坦克歼击车', tier: 'VIII', win: 54.0, dmg: 1852, premium: true },
];
const NAV = ['Agent', 'Tankopedia', 'Player', 'Replay', 'Compare', 'Settings'];
const NAV_TARGET = { Agent: 'sec-agent', Tankopedia: 'sec-tanks', Player: 'sec-player', Replay: 'sec-replay', Compare: 'sec-compare', Settings: 'sec-settings' };
const TankSVG = () => (
  <svg viewBox="0 0 140 60" fill="currentColor">
    <path d="M18 40 L26 30 L48 27 L52 16 L86 16 L90 27 L108 29 L122 34 L122 40 Z" opacity=".85" />
    <rect x="88" y="19" width="44" height="3.5" rx="1.7" />
    <rect x="126" y="17.5" width="8" height="6.5" rx="1.5" />
    <circle cx="40" cy="46" r="7" /><circle cx="60" cy="46" r="7" />
    <circle cx="80" cy="46" r="7" /><circle cx="100" cy="46" r="7" />
  </svg>
);

/* ═══ 页面 ═══ */
function App() {
  const [dark, setDark] = useState(true);
  const [nav, setNav] = useState('Agent');
  const [temp, setTemp] = useState(0.7);
  const chartRef = useRef(null);

  useEffect(() => { document.body.dataset.anttheme = dark ? 'dark' : 'light'; }, [dark]);

  useEffect(() => {
    if (!window.Chart || !chartRef.current) return;
    const c = new Chart(chartRef.current, {
      type: 'line',
      data: {
        labels: ['24-09','24-10','24-11','24-12','25-01','25-02','25-03','25-04','25-05','25-06','25-07','25-08'],
        datasets: [{
          data: [1950,2010,1985,2100,2210,2180,2340,2405,2510,2480,2620,2845],
          borderColor: '#ff8a3d', backgroundColor: 'rgba(255,138,61,.12)',
          fill: true, tension: .35, pointRadius: 2.5, pointBackgroundColor: '#ff8a3d', borderWidth: 2,
        }],
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#9c8f7f', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#9c8f7f', font: { size: 10 } }, grid: { color: 'rgba(128,128,140,.15)' } },
        },
      },
    });
    return () => c.destroy();
  }, []);

  const goNav = (v) => { setNav(v); document.getElementById(NAV_TARGET[v])?.scrollIntoView({ behavior: 'smooth' }); };

  return (
    <ConfigProvider theme={{
      algorithm: dark ? theme.darkAlgorithm : theme.defaultAlgorithm,
      token: { colorPrimary: '#ff8a3d', borderRadius: 10 },
    }}>
      {/* ═══ 顶部导航 ═══ */}
      <header style={{ position: 'sticky', top: 0, zIndex: 40, borderBottom: '1px solid rgba(128,128,128,.2)', padding: '10px 0', backdropFilter: 'blur(6px)' }}>
        <div className="wrap" style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <span style={{ fontWeight: 700, fontSize: 17 }}>WoTB<span style={{ color: '#ff8a3d' }}>.</span>Agent</span>
          <Segmented value={nav} onChange={goNav} options={NAV} />
          <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 12 }}>
            <a href="index.html" style={{ fontSize: 12, opacity: .6, color: 'inherit' }}>← 对比首页</a>
            <Button size="small" onClick={() => setDark(!dark)}>◐ {dark ? '暗色' : '亮色'}</Button>
          </span>
        </div>
      </header>

      <div className="wrap">

        {/* ═══ Agent 聊天 ═══ */}
        <section id="sec-agent" className="grid-chat">
          <Card size="small" title="会话" extra={<Button size="small" type="primary">＋ 新会话</Button>}>
            <div className="session-row active">IS-7 走位分析<div style={{ fontSize: 11, opacity: .5 }}>今天 21:34</div></div>
            <div className="session-row">本周排位复盘<div style={{ fontSize: 11, opacity: .5 }}>昨天</div></div>
            <div className="session-row">Tier X 弱势车盘点<div style={{ fontSize: 11, opacity: .5 }}>09-16</div></div>
            <div className="session-row">Skorpion G 配件推荐<div style={{ fontSize: 11, opacity: .5 }}>09-14</div></div>
          </Card>
          <Card size="small" title={<span>Agent · IS-7 走位分析</span>} extra={<Tag color="green" bordered={false}>● idle</Tag>}>
            <div className="chat-log">
              <div className="bubble-user">帮我分析这局 IS-7 的走位，replay 在 D:\replays\2025_09_18_is7.wotbreplay</div>
              <span className="tool-chip">⚙ scan_replays · 12 场 · 3.2s</span>
              <div className="bubble-bot">这局你在 <b>4:10</b> 从铁路侧推进过早，在没有队友视野支援的情况下进入了 268 工程的射界。建议：城市缠斗阶段贴掩体推进，等对方 TD 暴露后再转场……</div>
              <span className="tool-chip">⚙ tank_detail · IS-7 · 1.1s</span>
              <div className="bubble-bot">对照 IS-7 顶级炮塔数据（俯角 -5°），该位置实际可以卡住斜坡卖头，命中率可提升约 12%。</div>
            </div>
            <div style={{ display: 'flex', gap: 8, paddingTop: 10, borderTop: '1px solid rgba(128,128,128,.2)' }}>
              <Input placeholder="输入消息，Enter 发送…" />
              <Button type="primary">发送 ↵</Button>
            </div>
          </Card>
        </section>

        {/* ═══ Replay 扫描报告 ═══ */}
        <section id="sec-replay">
          <div className="grid-stats" style={{ marginBottom: 16 }}>
            <Card size="small"><Statistic title="扫描场次" value="12,483" /><div style={{ fontSize: 12, opacity: .55, marginTop: 4 }}>近 30 天 +412</div></Card>
            <Card size="small"><Statistic title="总胜率" value="54.3%" valueStyle={{ color: '#3fbf6f' }} /><div style={{ fontSize: 12, opacity: .55, marginTop: 4 }}>▲ +0.8%</div></Card>
            <Card size="small"><Statistic title="场均伤害" value="2,187" /><div style={{ fontSize: 12, opacity: .55, marginTop: 4 }}>▲ +42</div></Card>
            <Card size="small"><Statistic title="WN8" value="2,845" valueStyle={{ color: '#ff8a3d' }} /><Tag color="orange" style={{ marginTop: 4 }}>优秀</Tag></Card>
          </div>
          <Card size="small" title="WN8 评级走势" extra={<Tag color="orange" bordered={false}>近 12 个月</Tag>}>
            <canvas ref={chartRef} height="88"></canvas>
          </Card>
        </section>

        {/* ═══ Tankopedia ═══ */}
        <section id="sec-tanks">
          <Card size="small" title="Tankopedia · 坦克百科" extra={<Tag color="blue" bordered={false}>1,204 辆</Tag>}>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
              <Input placeholder="搜索坦克名称…" style={{ width: 200 }} />
              <Select options={[{value:'all',label:'全部等级'},{value:'x',label:'X'},{value:'viii',label:'VIII'}]} defaultValue="all" style={{ width: 120 }} />
              <Select options={[{value:'all',label:'全部国家'},{value:'ussr',label:'苏联'},{value:'germany',label:'德国'}]} defaultValue="all" style={{ width: 120 }} />
              <Select options={[{value:'all',label:'全部类型'},{value:'heavy',label:'重型'},{value:'medium',label:'中型'}]} defaultValue="all" style={{ width: 120 }} />
              <Select options={[{value:'win',label:'按胜率排序'},{value:'dpm',label:'按 DPM'}]} defaultValue="win" style={{ width: 130 }} />
              <Button type="primary" style={{ marginLeft: 'auto' }}>筛选</Button>
            </div>
            <div className="grid-tanks">
              {TANKS.map(t => (
                <Card key={t.name} size="small" hoverable className={cx('tank-card', t.premium && 'premium', t.collector && 'collector')} styles={{ body: { padding: 12 } }}>
                  <div className="tank-thumb">
                    <Tag color="orange" className="tier-chip">{t.tier}</Tag>
                    <TankSVG />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 4 }}>
                    <b style={{ fontSize: 13, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.name}</b>
                    {t.premium && <Tag color="gold" style={{ marginRight: 0 }}>金币</Tag>}
                    {t.collector && <Tag color="blue" style={{ marginRight: 0 }}>收藏</Tag>}
                  </div>
                  <div style={{ fontSize: 12, opacity: .55, margin: '2px 0 8px' }}>{t.nation} · {t.type}</div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12 }}>
                    <span>胜率 <b>{t.win}%</b></span><span style={{ opacity: .5 }}>均伤 {t.dmg}</span>
                  </div>
                </Card>
              ))}
            </div>
          </Card>
        </section>

        {/* ═══ Player ═══ */}
        <section id="sec-player">
          <Card size="small" title="Player · 玩家战绩查询">
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
              <Input defaultValue="fyp25" placeholder="游戏昵称" style={{ width: 220 }} />
              <Select options={[{value:'cn',label:'国服'},{value:'asia',label:'亚服'},{value:'eu',label:'欧服'}]} defaultValue="cn" style={{ width: 110 }} />
              <Button type="primary">查询</Button>
            </div>
            <div className="grid-stats">
              <Card size="small"><Statistic title="场次" value="31,204" /></Card>
              <Card size="small"><Statistic title="胜率" value="54.3%" valueStyle={{ color: '#3fbf6f' }} /></Card>
              <Card size="small"><Statistic title="三环" value="27" valueStyle={{ color: '#ff8a3d' }} /></Card>
              <Card size="small"><Statistic title="K/D" value="1.42" /></Card>
            </div>
          </Card>
        </section>

        {/* ═══ Compare ═══ */}
        <section id="sec-compare">
          <Card size="small" title="Compare · 本局 Replay vs API 战绩">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              <div>
                <Tag color="orange" style={{ marginBottom: 8 }}>本局 Replay</Tag>
                <table style={{ width: '100%', fontSize: 13, borderCollapse: 'collapse' }}>
                  <tbody>
                    <tr><td style={{ padding: '6px 0' }}>伤害</td><td style={{ textAlign: 'right' }}><b>4,861</b></td></tr>
                    <tr><td style={{ padding: '6px 0' }}>击毁</td><td style={{ textAlign: 'right' }}><b>3</b></td></tr>
                    <tr><td style={{ padding: '6px 0' }}>命中率</td><td style={{ textAlign: 'right' }}><b>76%</b></td></tr>
                  </tbody>
                </table>
              </div>
              <div>
                <Tag color="blue" style={{ marginBottom: 8 }}>API 近 100 场均值</Tag>
                <table style={{ width: '100%', fontSize: 13, borderCollapse: 'collapse', opacity: .6 }}>
                  <tbody>
                    <tr><td style={{ padding: '6px 0' }}>伤害</td><td style={{ textAlign: 'right' }}>2,187</td></tr>
                    <tr><td style={{ padding: '6px 0' }}>击毁</td><td style={{ textAlign: 'right' }}>1.3</td></tr>
                    <tr><td style={{ padding: '6px 0' }}>命中率</td><td style={{ textAlign: 'right' }}>71%</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </Card>
        </section>

        {/* ═══ Settings ═══ */}
        <section id="sec-settings">
          <Card size="small" title="Settings · 配置">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 32 }}>
              <div>
                <div style={{ fontSize: 12, opacity: .6, marginBottom: 6 }}>模型</div>
                <Select options={[{value:'ds',label:'deepseek-chat'},{value:'gpt',label:'gpt-4o'},{value:'cla',label:'claude-sonnet'}]} defaultValue="ds" style={{ width: '100%' }} />
                <div style={{ fontSize: 12, opacity: .6, margin: '16px 0 2px' }}>温度 {temp.toFixed(1)}</div>
                <Slider min={0} max={1} step={0.1} value={temp} onChange={setTemp} tooltip={{ open: false }} />
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14, justifyContent: 'center' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>回放目录自动扫描</span><Switch defaultChecked size="small" /></div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>工具调用前确认</span><Switch defaultChecked size="small" /></div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Token 用量告警</span><Switch size="small" /></div>
              </div>
            </div>
          </Card>
        </section>

        <footer style={{ textAlign: 'center', fontSize: 12, opacity: .5, margin: '24px 0 8px' }}>
          方案 5 / 8 · Ant Design 5（构建链方案，此处为浏览器内编译演示）· 示例数据仅供对比 · 需联网加载 CDN
        </footer>
      </div>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
