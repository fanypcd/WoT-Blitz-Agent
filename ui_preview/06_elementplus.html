<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 6 · Element Plus — WoTB.Agent UI 对比</title>
<!-- Vue 3 + Element Plus（UMD 版）+ 暗色变量 -->
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.8/dist/index.css">
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.8/theme-chalk/dark/css-vars.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.8.8/dist/index.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* 兜底基础样式：CDN 不可用时仍可读 */
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--el-bg-color-page, #0a0a0a); color: var(--el-text-color-primary, #eee); }
  [v-cloak] { display: none; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  section { margin-top: 20px; }
  .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .grid-tanks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .grid-chat  { display: grid; grid-template-columns: 250px 1fr; gap: 16px; }
  @media (max-width: 860px) {
    .grid-stats { grid-template-columns: repeat(2, 1fr); }
    .grid-chat { grid-template-columns: 1fr; }
  }

  /* 收藏车 / 金币车描边 */
  .tank-card.premium   { --el-card-border-color: rgba(230, 162, 60, .8) !important; border: 1.5px solid rgba(230, 162, 60, .8) !important; }
  .tank-card.collector { border: 1.5px solid rgba(64, 158, 255, .9) !important; }
  .tank-thumb { position: relative; padding: 18px 12px 10px; }
  .tank-thumb svg { width: 100%; height: 64px; opacity: .5; display: block; }
  .tier-chip { position: absolute; top: 8px; left: 8px; }

  /* 会话列表与聊天气泡 */
  .session-row { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .session-row:hover { background: var(--el-fill-color-light); }
  .session-row.active { background: var(--el-color-primary-light-9); color: var(--el-color-primary); }
  .chat-log { height: 300px; overflow-y: auto; padding-right: 6px; }
  .bubble-bot  { max-width: 84%; background: var(--el-fill-color-light); border-radius: 10px; padding: 9px 12px;
                 font-size: 13px; line-height: 1.65; margin-bottom: 10px; }
  .bubble-user { max-width: 84%; background: var(--el-color-primary-light-9); border: 1px solid var(--el-color-primary-light-5);
                 border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.65; margin-bottom: 10px; margin-left: auto; width: fit-content; }
  .tool-chip { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; border: 1px dashed var(--el-border-color);
               opacity: .7; margin-bottom: 4px; }

  /* Element Plus 品牌橙覆盖（需连同 light-3~9 / dark-2 混色变量一起覆盖） */
  :root {
    --el-color-primary: #ff8a3d;
    --el-color-primary-light-3: #ffa76b;
    --el-color-primary-light-5: #ffc199;
    --el-color-primary-light-7: #ffddc2;
    --el-color-primary-light-8: #ffe8d4;
    --el-color-primary-light-9: #fff4ea;
    --el-color-primary-dark-2: #e8762a;
  }
  html.dark {
    --el-color-primary: #ff8a3d;
    --el-color-primary-light-3: #b96731;
    --el-color-primary-light-5: #8a4f27;
    --el-color-primary-light-7: #5c361d;
    --el-color-primary-light-8: #442a19;
    --el-color-primary-light-9: #2d1d14;
    --el-color-primary-dark-2: #ffa05e;
  }
</style>
</head>
<body>
<div id="app" v-cloak></div>

<script type="text/x-template" id="tpl">
<el-config-provider :locale="zhCn">
  <div style="min-height:100vh">

    <!-- ═══ 顶部导航 ═══ -->
    <div style="position:sticky; top:0; z-index:40; border-bottom:1px solid var(--el-border-color-lighter); background:var(--el-bg-color); padding:8px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      <span style="font-weight:700; font-size:17px;">WoTB<span style="color:var(--el-color-primary)">.</span>Agent</span>
      <el-menu mode="horizontal" :default-active="active" style="flex:1; min-width:0; border-bottom:none;" @select="onNav">
        <el-menu-item index="sec-agent">Agent</el-menu-item>
        <el-menu-item index="sec-tanks">Tankopedia</el-menu-item>
        <el-menu-item index="sec-player">Player</el-menu-item>
        <el-menu-item index="sec-replay">Replay</el-menu-item>
        <el-menu-item index="sec-compare">Compare</el-menu-item>
        <el-menu-item index="sec-settings">Settings</el-menu-item>
      </el-menu>
      <span style="display:flex; align-items:center; gap:12px;">
        <a href="index.html" style="font-size:12px; opacity:.6; color:inherit;">← 对比首页</a>
        <el-button size="small" circle @click="dark = !dark">◐</el-button>
      </span>
    </div>

    <div class="wrap" style="padding-bottom:32px;">

      <!-- ═══ Agent 聊天 ═══ -->
      <section id="sec-agent" class="grid-chat">
        <el-card shadow="never" body-style="padding:8px;">
          <template #header>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:13px; font-weight:600;">会话</span>
              <el-button type="primary" size="small">＋ 新会话</el-button>
            </div>
          </template>
          <div class="session-row active">IS-7 走位分析<div style="font-size:11px; opacity:.5">今天 21:34</div></div>
          <div class="session-row">本周排位复盘<div style="font-size:11px; opacity:.5">昨天</div></div>
          <div class="session-row">Tier X 弱势车盘点<div style="font-size:11px; opacity:.5">09-16</div></div>
          <div class="session-row">Skorpion G 配件推荐<div style="font-size:11px; opacity:.5">09-14</div></div>
        </el-card>
        <el-card shadow="never" body-style="padding:16px;">
          <template #header>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:13px; font-weight:600;">Agent · IS-7 走位分析</span>
              <el-tag type="success" size="small" effect="plain" round>● idle</el-tag>
            </div>
          </template>
          <div class="chat-log">
            <div class="bubble-user">帮我分析这局 IS-7 的走位，replay 在 D:\replays\2025_09_18_is7.wotbreplay</div>
            <span class="tool-chip">⚙ scan_replays · 12 场 · 3.2s</span>
            <div class="bubble-bot">这局你在 <b>4:10</b> 从铁路侧推进过早，在没有队友视野支援的情况下进入了 268 工程的射界。建议：城市缠斗阶段贴掩体推进，等对方 TD 暴露后再转场……</div>
            <span class="tool-chip">⚙ tank_detail · IS-7 · 1.1s</span>
            <div class="bubble-bot">对照 IS-7 顶级炮塔数据（俯角 -5°），该位置实际可以卡住斜坡卖头，命中率可提升约 12%。</div>
          </div>
          <div style="display:flex; gap:8px; padding-top:12px;">
            <el-input placeholder="输入消息，Enter 发送…"></el-input>
            <el-button type="primary">发送 ↵</el-button>
          </div>
        </el-card>
      </section>

      <!-- ═══ Replay 扫描报告 ═══ -->
      <section id="sec-replay">
        <div class="grid-stats" style="margin-bottom:16px;">
          <el-card shadow="never" body-style="padding:14px;"><el-statistic title="扫描场次" value="12,483"></el-statistic><div style="font-size:12px; opacity:.55; margin-top:4px;">近 30 天 +412</div></el-card>
          <el-card shadow="never" body-style="padding:14px;"><el-statistic title="总胜率" value="54.3%" :value-style="{ color: 'var(--el-color-success)' }"></el-statistic><div style="font-size:12px; opacity:.55; margin-top:4px;">▲ +0.8%</div></el-card>
          <el-card shadow="never" body-style="padding:14px;"><el-statistic title="场均伤害" value="2,187"></el-statistic><div style="font-size:12px; opacity:.55; margin-top:4px;">▲ +42</div></el-card>
          <el-card shadow="never" body-style="padding:14px;"><el-statistic title="WN8" value="2,845" :value-style="{ color: 'var(--el-color-primary)' }"></el-statistic><el-tag type="warning" size="small" style="margin-top:4px;">优秀</el-tag></el-card>
        </div>
        <el-card shadow="never">
          <template #header>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:13px; font-weight:600;">WN8 评级走势</span>
              <el-tag type="warning" size="small" effect="plain" round>近 12 个月</el-tag>
            </div>
          </template>
          <canvas id="wn8chart" height="88"></canvas>
        </el-card>
      </section>

      <!-- ═══ Tankopedia ═══ -->
      <section id="sec-tanks">
        <el-card shadow="never">
          <template #header>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:13px; font-weight:600;">Tankopedia · 坦克百科</span>
              <el-tag type="info" size="small" effect="plain">1,204 辆</el-tag>
            </div>
          </template>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
            <el-input placeholder="搜索坦克名称…" style="width:200px"></el-input>
            <el-select v-model="fTier" style="width:120px">
              <el-option label="全部等级" value="all"></el-option>
              <el-option label="X" value="x"></el-option>
              <el-option label="VIII" value="viii"></el-option>
            </el-select>
            <el-select v-model="fNation" style="width:120px">
              <el-option label="全部国家" value="all"></el-option>
              <el-option label="苏联" value="ussr"></el-option>
              <el-option label="德国" value="germany"></el-option>
            </el-select>
            <el-select v-model="fType" style="width:120px">
              <el-option label="全部类型" value="all"></el-option>
              <el-option label="重型" value="heavy"></el-option>
              <el-option label="中型" value="medium"></el-option>
            </el-select>
            <el-select v-model="fSort" style="width:130px">
              <el-option label="按胜率排序" value="win"></el-option>
              <el-option label="按 DPM" value="dpm"></el-option>
            </el-select>
            <el-button type="primary" style="margin-left:auto;">筛选</el-button>
          </div>
          <div class="grid-tanks">
            <el-card v-for="t in tanks" :key="t.name" shadow="hover" class="tank-card"
                     :class="t.premium ? 'premium' : (t.collector ? 'collector' : '')" body-style="padding:12px;">
              <div class="tank-thumb">
                <el-tag type="warning" size="small" round class="tier-chip">{{ t.tier }}</el-tag>
                <svg viewBox="0 0 140 60" fill="currentColor">
                  <path d="M18 40 L26 30 L48 27 L52 16 L86 16 L90 27 L108 29 L122 34 L122 40 Z" opacity=".85"></path>
                  <rect x="88" y="19" width="44" height="3.5" rx="1.7"></rect>
                  <rect x="126" y="17.5" width="8" height="6.5" rx="1.5"></rect>
                  <circle cx="40" cy="46" r="7"></circle><circle cx="60" cy="46" r="7"></circle>
                  <circle cx="80" cy="46" r="7"></circle><circle cx="100" cy="46" r="7"></circle>
                </svg>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; gap:4px;">
                <b style="font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;">{{ t.name }}</b>
                <el-tag v-if="t.premium" type="warning" size="small">金币</el-tag>
                <el-tag v-else-if="t.collector" type="primary" size="small">收藏</el-tag>
              </div>
              <div style="font-size:12px; opacity:.55; margin:2px 0 8px;">{{ t.nation }} · {{ t.type }}</div>
              <div style="display:flex; justify-content:space-between; font-size:12px;">
                <span>胜率 <b>{{ t.win }}%</b></span><span style="opacity:.5">均伤 {{ t.dmg }}</span>
              </div>
            </el-card>
          </div>
        </el-card>
      </section>

      <!-- ═══ Player ═══ -->
      <section id="sec-player">
        <el-card shadow="never">
          <template #header><span style="font-size:13px; font-weight:600;">Player · 玩家战绩查询</span></template>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
            <el-input v-model="nickname" style="width:220px"></el-input>
            <el-select v-model="realm" style="width:110px">
              <el-option label="国服" value="cn"></el-option>
              <el-option label="亚服" value="asia"></el-option>
              <el-option label="欧服" value="eu"></el-option>
            </el-select>
            <el-button type="primary">查询</el-button>
          </div>
          <div class="grid-stats">
            <el-card shadow="never" body-style="padding:14px;"><el-statistic title="场次" value="31,204"></el-statistic></el-card>
            <el-card shadow="never" body-style="padding:14px;"><el-statistic title="胜率" value="54.3%" :value-style="{ color: 'var(--el-color-success)' }"></el-statistic></el-card>
            <el-card shadow="never" body-style="padding:14px;"><el-statistic title="三环" value="27" :value-style="{ color: 'var(--el-color-primary)' }"></el-statistic></el-card>
            <el-card shadow="never" body-style="padding:14px;"><el-statistic title="K/D" value="1.42"></el-statistic></el-card>
          </div>
        </el-card>
      </section>

      <!-- ═══ Compare ═══ -->
      <section id="sec-compare">
        <el-card shadow="never">
          <template #header><span style="font-size:13px; font-weight:600;">Compare · 本局 Replay vs API 战绩</span></template>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div>
              <el-tag type="warning" size="small" style="margin-bottom:8px;">本局 Replay</el-tag>
              <el-table :data="replayRows" size="small" :show-header="false">
                <el-table-column prop="k" width="120"></el-table-column>
                <el-table-column prop="v" align="right" width="80">
                  <template #default="s"><b>{{ s.row.v }}</b></template>
                </el-table-column>
              </el-table>
            </div>
            <div>
              <el-tag type="primary" size="small" effect="plain" style="margin-bottom:8px;">API 近 100 场均值</el-tag>
              <el-table :data="apiRows" size="small" :show-header="false" style="opacity:.6;">
                <el-table-column prop="k" width="120"></el-table-column>
                <el-table-column prop="v" align="right" width="80"></el-table-column>
              </el-table>
            </div>
          </div>
        </el-card>
      </section>

      <!-- ═══ Settings ═══ -->
      <section id="sec-settings">
        <el-card shadow="never">
          <template #header><span style="font-size:13px; font-weight:600;">Settings · 配置</span></template>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:32px;">
            <div>
              <div style="font-size:12px; opacity:.6; margin-bottom:6px;">模型</div>
              <el-select v-model="model" style="width:100%">
                <el-option label="deepseek-chat" value="ds"></el-option>
                <el-option label="gpt-4o" value="gpt"></el-option>
                <el-option label="claude-sonnet" value="cla"></el-option>
              </el-select>
              <div style="font-size:12px; opacity:.6; margin:16px 0 2px;">温度 {{ temp.toFixed(1) }}</div>
              <el-slider v-model="temp" :step="0.1" :min="0" :max="1"></el-slider>
            </div>
            <div style="display:flex; flex-direction:column; gap:14px; justify-content:center;">
              <div style="display:flex; justify-content:space-between; align-items:center;"><span style="font-size:13px">回放目录自动扫描</span><el-switch size="small"></el-switch></div>
              <div style="display:flex; justify-content:space-between; align-items:center;"><span style="font-size:13px">工具调用前确认</span><el-switch size="small"></el-switch></div>
              <div style="display:flex; justify-content:space-between; align-items:center;"><span style="font-size:13px">Token 用量告警</span><el-switch size="small"></el-switch></div>
            </div>
          </div>
        </el-card>
      </section>

      <footer style="text-align:center; font-size:12px; opacity:.5; margin:24px 0 8px;">
        方案 6 / 8 · Element Plus（构建链方案）· 示例数据仅供对比 · 需联网加载 CDN
      </footer>
    </div>
  </div>
</el-config-provider>
</script>

<script>
const { createApp, ref } = Vue;

createApp({
  template: '#tpl',
  setup() {
    const dark = ref(true);
    const active = ref('sec-agent');
    const nickname = ref('fyp25');
    const temp = ref(0.7);
    const fTier = ref('all'), fNation = ref('all'), fType = ref('all'), fSort = ref('win');
    const realm = ref('cn'), model = ref('ds');

    const tanks = [
      { name: 'IS-7',                 nation: '苏联',   type: '重型坦克', tier: 'X',    win: 52.8, dmg: 2204 },
      { name: 'Object 260',           nation: '苏联',   type: '重型坦克', tier: 'X',    win: 53.4, dmg: 2310, collector: true },
      { name: '121B',                 nation: '中国',   type: '中型坦克', tier: 'X',    win: 54.6, dmg: 2458, premium: true },
      { name: 'E 100',                nation: '德国',   type: '重型坦克', tier: 'X',    win: 51.2, dmg: 2265 },
      { name: 'Leopard 1',            nation: '德国',   type: '中型坦克', tier: 'X',    win: 52.1, dmg: 2372 },
      { name: 'T110E5',               nation: '美国',   type: '重型坦克', tier: 'X',    win: 50.9, dmg: 2190 },
      { name: 'Progetto M35 mod. 46', nation: '意大利', type: '中型坦克', tier: 'VIII', win: 55.3, dmg: 1690, premium: true },
      { name: 'Skorpion G',           nation: '德国',   type: '坦克歼击车', tier: 'VIII', win: 54.0, dmg: 1852, premium: true },
    ];
    const replayRows = [ { k: '伤害', v: '4,861' }, { k: '击毁', v: '3' }, { k: '命中率', v: '76%' } ];
    const apiRows    = [ { k: '伤害', v: '2,187' }, { k: '击毁', v: '1.3' }, { k: '命中率', v: '71%' } ];

    /* 主题切换：Element Plus 暗色 = html.dark + css-vars */
    function toggleDark(v) {
      document.documentElement.classList.toggle('dark', v);
    }
    Vue.watchEffect(() => toggleDark(dark.value));

    function onNav(idx) {
      active.value = idx;
      const el = document.getElementById(idx);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    /* WN8 走势图 */
    Vue.onMounted(() => {
      if (!window.Chart) return;
      new Chart(document.getElementById('wn8chart'), {
        type: 'line',
        data: {
          labels: ['24-09','24-10','24-11','24-12','25-01','25-02','25-03','25-04','25-05','25-06','25-07','25-08'],
          datasets: [{
            data: [1950,2010,1985,2100,2210,2180,2340,2405,2510,2480,2620,2845],
            borderColor: '#ff8a3d', backgroundColor: 'rgba(255,138,61,.10)',
            fill: true, tension: .35, pointRadius: 2.5, pointBackgroundColor: '#ff8a3d', borderWidth: 2,
          }],
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#9c8f7f', font: { size: 10 } }, grid: { display: false } },
            y: { ticks: { color: '#9c8f7f', font: { size: 10 } }, grid: { color: 'rgba(128,128,140,.15)' } },
          },
        },
      });
    });

    return {
      dark, active, nickname, temp, fTier, fNation, fType, fSort, realm, model,
      tanks, replayRows, apiRows, onNav,
      zhCn: (typeof ElementPlusLocaleZhCn !== 'undefined') ? ElementPlusLocaleZhCn : undefined,
    };
  },
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
