<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 4 · React + shadcn/ui — WoTB.Agent UI 对比</title>
<!-- Tailwind Play CDN + React UMD + Babel（浏览器内编译，仅作演示；真实项目用 Vite 构建） -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          border: 'hsl(var(--border))',
          input: 'hsl(var(--input))',
          ring: 'hsl(var(--ring))',
          background: 'hsl(var(--background))',
          foreground: 'hsl(var(--foreground))',
          primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
          secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
        },
        borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
      },
    },
  };
</script>
<!-- shadcn/ui 设计 token（zinc 底 + 品牌橙 primary） -->
<style>
  :root { /* 亮色 */
    --background: 0 0% 100%; --foreground: 240 10% 3.9%;
    --card: 0 0% 100%; --card-foreground: 240 10% 3.9%;
    --primary: 24 100% 62%; --primary-foreground: 20 90% 8%;
    --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
    --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 24 100% 62%;
    --radius: 0.75rem;
  }
  .dark { /* 暗色（默认） */
    --background: 240 10% 3.9%; --foreground: 0 0% 98%;
    --card: 240 8% 5.5%; --card-foreground: 0 0% 98%;
    --primary: 24 100% 62%; --primary-foreground: 20 90% 8%;
    --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%;
    --border: 240 3.7% 15.9%; --input: 240 3.7% 15.9%; --ring: 24 100% 62%;
  }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  section { margin-top: 1.25rem; }
</style>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const cx = (...a) => a.filter(Boolean).join(' ');

/* ═══ shadcn/ui 风格基础组件（真实项目由 shadcn CLI 生成，此处内联演示） ═══ */
function Card({ className, ...p }) {
  return <div className={cx("rounded-xl border bg-card text-card-foreground shadow-sm", className)} {...p} />;
}
function Button({ className, variant = 'default', ...p }) {
  const base = "inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none disabled:pointer-events-none disabled:opacity-50 h-9 px-4 py-2";
  const variants = {
    default: "bg-primary text-primary-foreground shadow hover:bg-primary/90",
    secondary: "bg-secondary text-secondary-foreground shadow-sm hover:bg-secondary/80",
    ghost: "hover:bg-accent hover:text-accent-foreground",
    outline: "border border-input bg-transparent shadow-sm hover:bg-accent",
  };
  return <button className={cx(base, variants[variant], className)} {...p} />;
}
function Badge({ className, ...p }) {
  return <span className={cx("inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors", className)} {...p} />;
}
function Input({ className, ...p }) {
  return <input className={cx("flex h-9 rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring w-full", className)} {...p} />;
}
function Select({ className, children, ...p }) {
  return <select className={cx("flex h-9 rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring", className)} {...p}>{children}</select>;
}
function Switch({ defaultOn, label }) {
  const [on, setOn] = useState(defaultOn);
  return (
    <div className="flex items-center justify-between">
      <span className="text-sm">{label}</span>
      <button onClick={() => setOn(!on)}
        className={cx("inline-flex h-5 w-9 shrink-0 items-center rounded-full border-2 border-transparent shadow-sm transition-colors", on ? "bg-primary" : "bg-secondary")}>
        <span className={cx("block h-4 w-4 rounded-full bg-background shadow transition-transform", on ? "translate-x-4" : "translate-x-0")} />
      </button>
    </div>
  );
}
function StatCard({ label, value, desc, valueClass }) {
  return (
    <Card className="p-4">
      <div className="text-sm text-muted-foreground">{label}</div>
      <div className={cx("text-2xl font-bold mt-1", valueClass)}>{value}</div>
      <div className="text-xs text-muted-foreground mt-1">{desc}</div>
    </Card>
  );
}
const TankSVG = () => (
  <svg viewBox="0 0 140 60" fill="currentColor" className="w-full h-16 opacity-50">
    <path d="M18 40 L26 30 L48 27 L52 16 L86 16 L90 27 L108 29 L122 34 L122 40 Z" opacity=".85" />
    <rect x="88" y="19" width="44" height="3.5" rx="1.7" />
    <rect x="126" y="17.5" width="8" height="6.5" rx="1.5" />
    <circle cx="40" cy="46" r="7" /><circle cx="60" cy="46" r="7" />
    <circle cx="80" cy="46" r="7" /><circle cx="100" cy="46" r="7" />
  </svg>
);

/* ═══ 示例数据 ═══ */
const TANKS = [
  { name: 'IS-7',                 nation: '苏联',   type: '重型坦克', tier: 'X',    win: 52.8, dmg: 2204 },
  { name: 'Object 260',           nation: '苏联',   type: '重型坦克', tier: 'X',    win: 53.4, dmg: 2310, collector: true },
  { name: '121B',                 nation: '中国',   type: '中型坦克', tier: 'X',    win: 54.6, dmg: 2458, premium: true },
  { name: 'E 100',                nation: '德国',   type: '重型坦克', tier: 'X',    win: 51.2, dmg: 2265 },
  { name: 'Leopard 1',            nation: '德国',   type: '中型坦克', tier: 'X',    win: 52.1, dmg: 2372 },
  { name: 'T110E5',               nation: '美国',   type: '重型坦克', tier: 'X',    win: 50.9, dmg: 2190 },
  { name: 'Progetto M35 mod. 46', nation: '意大利', type: '中型坦克', tier: 'VIII', win: 55.3, dmg: 1690, premium: true },
  { name: 'Skorpion G',           nation: '德国',   type: '坦克歼击车', tier: 'VIII', win: 54.0, dmg: 1852, premium: true },
];
const NAV = ['Agent', 'Tankopedia', 'Player', 'Replay', 'Compare', 'Settings'];
const NAV_TARGET = { Agent: 'sec-agent', Tankopedia: 'sec-tanks', Player: 'sec-player', Replay: 'sec-replay', Compare: 'sec-compare', Settings: 'sec-settings' };

/* ═══ 页面 ═══ */
function App() {
  const [dark, setDark] = useState(true);
  const [nav, setNav] = useState('Agent');
  const chartRef = useRef(null);

  useEffect(() => { document.documentElement.classList.toggle('dark', dark); }, [dark]);

  useEffect(() => {
    if (!window.Chart || !chartRef.current) return;
    const c = new Chart(chartRef.current, {
      type: 'line',
      data: {
        labels: ['24-09','24-10','24-11','24-12','25-01','25-02','25-03','25-04','25-05','25-06','25-07','25-08'],
        datasets: [{
          data: [1950,2010,1985,2100,2210,2180,2340,2405,2510,2480,2620,2845],
          borderColor: '#ff8a3d', backgroundColor: 'rgba(255,138,61,.10)',
          fill: true, tension: .35, pointRadius: 2.5, pointBackgroundColor: '#ff8a3d', borderWidth: 2,
        }],
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8b8b96', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#8b8b96', font: { size: 10 } }, grid: { color: 'rgba(128,128,140,.12)' } },
        },
      },
    });
    return () => c.destroy();
  }, []);

  const goNav = (n) => { setNav(n); document.getElementById(NAV_TARGET[n])?.scrollIntoView({ behavior: 'smooth' }); };

  return (
    <div className="min-h-screen">
      {/* ═══ 顶部导航 ═══ */}
      <header className="sticky top-0 z-40 border-b bg-background/80 backdrop-blur">
        <div className="max-w-[1200px] mx-auto px-4 h-14 flex items-center gap-4 flex-wrap">
          <span className="font-bold text-lg">WoTB<span className="text-primary">.</span>Agent</span>
          <nav className="flex gap-1 text-sm">
            {NAV.map(n => (
              <button key={n} onClick={() => goNav(n)}
                className={cx("rounded-md px-3 py-1.5 transition-colors",
                  nav === n ? "bg-secondary font-medium" : "text-muted-foreground hover:bg-accent")}>{n}</button>
            ))}
          </nav>
          <div className="ml-auto flex items-center gap-3">
            <a href="index.html" className="text-xs text-muted-foreground hover:text-foreground">← 对比首页</a>
            <Button variant="outline" size="sm" className="h-8 px-2.5" onClick={() => setDark(!dark)}>◐ {dark ? '暗色' : '亮色'}</Button>
          </div>
        </div>
      </header>

      <div className="max-w-[1200px] mx-auto px-4 pb-10">

        {/* ═══ Agent 聊天 ═══ */}
        <section id="sec-agent" className="grid grid-cols-1 md:grid-cols-[250px_1fr] gap-4">
          <Card>
            <div className="p-3 border-b flex items-center justify-between">
              <span className="text-sm font-semibold">会话</span>
              <Button size="sm" className="h-7 px-2.5 text-xs">＋ 新会话</Button>
            </div>
            <div className="p-2">
              {[['IS-7 走位分析', '今天 21:34', true], ['本周排位复盘', '昨天'], ['Tier X 弱势车盘点', '09-16'], ['Skorpion G 配件推荐', '09-14']].map(([t, d, a]) => (
                <div key={t} className={cx("rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-accent", a && "bg-accent")}>
                  {t}<div className="text-xs text-muted-foreground">{d}</div>
                </div>
              ))}
            </div>
          </Card>
          <Card className="flex flex-col">
            <div className="p-3 border-b flex items-center justify-between">
              <span className="text-sm font-semibold">Agent · IS-7 走位分析</span>
              <Badge className="border-transparent bg-emerald-500/15 text-emerald-500">● idle</Badge>
            </div>
            <div className="flex-1 p-4 space-y-3 h-[300px] overflow-y-auto">
              <div className="flex justify-end"><div className="max-w-[80%] rounded-xl bg-primary text-primary-foreground px-3 py-2 text-sm">帮我分析这局 IS-7 的走位，replay 在 D:\replays\2025_09_18_is7.wotbreplay</div></div>
              <div>
                <span className="inline-block text-xs text-muted-foreground border border-dashed border-border rounded-full px-2.5 py-0.5 mb-1">⚙ scan_replays · 12 场 · 3.2s</span>
                <div className="max-w-[85%] rounded-xl bg-secondary px-3 py-2 text-sm leading-relaxed">这局你在 <b>4:10</b> 从铁路侧推进过早，在没有队友视野支援的情况下进入了 268 工程的射界。建议：城市缠斗阶段贴掩体推进，等对方 TD 暴露后再转场……</div>
              </div>
              <div>
                <span className="inline-block text-xs text-muted-foreground border border-dashed border-border rounded-full px-2.5 py-0.5 mb-1">⚙ tank_detail · IS-7 · 1.1s</span>
                <div className="max-w-[85%] rounded-xl bg-secondary px-3 py-2 text-sm leading-relaxed">对照 IS-7 顶级炮塔数据（俯角 -5°），该位置实际可以卡住斜坡卖头，命中率可提升约 12%。</div>
              </div>
            </div>
            <div className="p-3 border-t flex gap-2">
              <Input placeholder="输入消息，Enter 发送…" />
              <Button>发送 ↵</Button>
            </div>
          </Card>
        </section>

        {/* ═══ Replay 扫描报告 ═══ */}
        <section id="sec-replay">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <StatCard label="扫描场次" value="12,483" desc="近 30 天 +412" />
            <StatCard label="总胜率" value="54.3%" desc="▲ +0.8%" valueClass="text-emerald-500" />
            <StatCard label="场均伤害" value="2,187" desc="▲ +42" />
            <StatCard label="WN8" value="2,845" desc="优秀" valueClass="text-primary" />
          </div>
          <Card className="mt-4">
            <div className="p-4 pb-0 flex items-center justify-between">
              <span className="text-sm font-semibold">WN8 评级走势</span>
              <Badge className="border-primary/40 text-primary">近 12 个月</Badge>
            </div>
            <div className="p-4"><canvas ref={chartRef} height="88" /></div>
          </Card>
        </section>

        {/* ═══ Tankopedia ═══ */}
        <section id="sec-tanks">
          <Card>
            <div className="p-4 pb-0 flex items-center justify-between flex-wrap gap-2">
              <span className="text-sm font-semibold">Tankopedia · 坦克百科</span>
              <Badge className="border-sky-500/40 text-sky-500">1,204 辆</Badge>
            </div>
            <div className="p-4 flex flex-wrap gap-2">
              <Input className="w-52" placeholder="搜索坦克名称…" />
              <Select><option>全部等级</option><option>X</option><option>VIII</option></Select>
              <Select><option>全部国家</option><option>苏联</option><option>德国</option></Select>
              <Select><option>全部类型</option><option>重型</option><option>中型</option></Select>
              <Select><option>按胜率排序</option><option>按 DPM</option></Select>
              <Button className="ml-auto">筛选</Button>
            </div>
            <div className="px-4 pb-4 grid grid-cols-2 md:grid-cols-4 gap-4">
              {TANKS.map(t => (
                <Card key={t.name} className={cx("overflow-hidden", t.premium && "ring-2 ring-amber-400/70", t.collector && "ring-2 ring-sky-400/70")}>
                  <div className="relative p-4 pb-1 text-muted-foreground">
                    <Badge className="absolute top-2 left-2 border-primary/50 text-primary">{t.tier}</Badge>
                    <TankSVG />
                  </div>
                  <div className="p-3 pt-1">
                    <div className="flex items-center justify-between gap-1">
                      <span className="text-sm font-bold truncate">{t.name}</span>
                      {t.premium && <Badge className="border-amber-400/50 text-amber-400">金币</Badge>}
                      {t.collector && <Badge className="border-sky-400/50 text-sky-400">收藏</Badge>}
                    </div>
                    <div className="text-xs text-muted-foreground mt-0.5">{t.nation} · {t.type}</div>
                    <div className="flex justify-between text-xs mt-2">
                      <span>胜率 <b>{t.win}%</b></span><span className="text-muted-foreground">均伤 {t.dmg}</span>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          </Card>
        </section>

        {/* ═══ Player ═══ */}
        <section id="sec-player">
          <Card>
            <div className="p-4 border-b text-sm font-semibold">Player · 玩家战绩查询</div>
            <div className="p-4">
              <div className="flex flex-wrap gap-2 mb-4">
                <Input className="w-56" defaultValue="fyp25" placeholder="游戏昵称" />
                <Select><option>国服</option><option>亚服</option><option>欧服</option></Select>
                <Button>查询</Button>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {[['场次', '31,204', ''], ['胜率', '54.3%', 'text-emerald-500'], ['三环', '27', 'text-primary'], ['K/D', '1.42', '']].map(([l, v, c]) => (
                  <div key={l} className="rounded-lg border p-3 text-center">
                    <div className="text-xs text-muted-foreground">{l}</div>
                    <div className={cx("text-xl font-bold", c)}>{v}</div>
                  </div>
                ))}
              </div>
            </div>
          </Card>
        </section>

        {/* ═══ Compare ═══ */}
        <section id="sec-compare">
          <Card>
            <div className="p-4 border-b text-sm font-semibold">Compare · 本局 Replay vs API 战绩</div>
            <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="rounded-lg border p-3">
                <Badge className="border-primary/50 text-primary mb-2">本局 Replay</Badge>
                <table className="w-full text-sm mt-2"><tbody>
                  <tr><td className="py-1">伤害</td><td className="py-1 text-right font-bold">4,861</td></tr>
                  <tr><td className="py-1">击毁</td><td className="py-1 text-right font-bold">3</td></tr>
                  <tr><td className="py-1">命中率</td><td className="py-1 text-right font-bold">76%</td></tr>
                </tbody></table>
              </div>
              <div className="rounded-lg border p-3">
                <Badge className="border-sky-400/50 text-sky-400 mb-2">API 近 100 场均值</Badge>
                <table className="w-full text-sm mt-2"><tbody>
                  <tr><td className="py-1">伤害</td><td className="py-1 text-right text-muted-foreground">2,187</td></tr>
                  <tr><td className="py-1">击毁</td><td className="py-1 text-right text-muted-foreground">1.3</td></tr>
                  <tr><td className="py-1">命中率</td><td className="py-1 text-right text-muted-foreground">71%</td></tr>
                </tbody></table>
              </div>
            </div>
          </Card>
        </section>

        {/* ═══ Settings ═══ */}
        <section id="sec-settings">
          <Card>
            <div className="p-4 border-b text-sm font-semibold">Settings · 配置</div>
            <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <div className="text-xs text-muted-foreground mb-1.5">模型</div>
                <Select className="w-full"><option>deepseek-chat</option><option>gpt-4o</option><option>claude-sonnet</option></Select>
                <div className="text-xs text-muted-foreground mt-4 mb-1.5">温度 0.7</div>
                <input type="range" min="0" max="1" step="0.1" defaultValue="0.7" className="w-full accent-orange-400" />
              </div>
              <div className="flex flex-col gap-4 justify-center">
                <Switch defaultOn label="回放目录自动扫描" />
                <Switch defaultOn label="工具调用前确认" />
                <Switch label="Token 用量告警" />
              </div>
            </div>
          </Card>
        </section>

        <footer className="text-center text-xs text-muted-foreground my-6">方案 4 / 4 · React + shadcn/ui（构建链方案，此处为浏览器内编译演示）· 示例数据仅供对比 · 需联网加载 CDN</footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
